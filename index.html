<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Демократия — Финал</title>
<link rel="icon" href="data:,">

<style id="boot-css">
html, body { margin: 0; background: #6a7a72; }
#boot { position: fixed; inset: 0; z-index: 6000; background: #6a7a72; transition: opacity 0.3s ease; }
#boot img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
#boot.hide { opacity: 0; pointer-events: none; }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; -webkit-touch-callout: none; }
*:focus, *:active { outline: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; user-select: none; touch-action: none; background: #7e6829; overscroll-behavior: none; }
body { background: #7e6829; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; height: 100dvh; }
/* Telegram writes --tg-safe-area-inset-* and --tg-content-safe-area-inset-* from WebApp.safeAreaInset / contentSafeAreaInset. Content inset is the Telegram chrome only, so it is added to the device inset. env() covers the same device inset when the client has not reported one yet. */
:root {
  --ui-top: calc(max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
  --ui-right: calc(max(env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px)) + var(--tg-content-safe-area-inset-right, 0px));
  --ui-bottom: calc(max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px)) + var(--tg-content-safe-area-inset-bottom, 0px));
  --ui-left: calc(max(env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px)) + var(--tg-content-safe-area-inset-left, 0px));
}
#app { --forest-lift: max(0px, calc(var(--ui-top) - 100cqw * 137 / 877)); width: 100%; max-width: 480px; height: 100vh; height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; background: linear-gradient(rgba(8, 14, 4, 0.30), rgba(8, 14, 4, 0.30)) center top / cover no-repeat, #3e5c22 url('img/forest_full.jpg?v=54') center top / cover no-repeat; container-type: inline-size; padding-top: 0; padding-right: var(--ui-right); padding-bottom: 0; padding-left: var(--ui-left); }

#board { contain: layout paint; transform: translateZ(0); }
.bottom-panel { transform: translateZ(0); }

/* ВЕРХ. Один лес img/forest_full.jpg на весь #app (cover, верх по центру, затемнение). Полоса над HUD прозрачная — сквозь неё виден тот же фон, без шва с низом. Под ней img/hud_top.png. Дорога под панелью целиком. */
.top-panel { position: relative; z-index: 2; width: 100%; flex-shrink: 0; margin-top: var(--forest-lift); display: flex; flex-direction: column; }
.top-forest { position: absolute; left: 0; right: 0; top: calc(-1 * var(--forest-lift)); height: calc(100cqw * 137 / 877 + var(--forest-lift)); background: none; pointer-events: none; }
.top-hud { position: relative; width: 100%; margin-top: calc(100cqw * 137 / 877); aspect-ratio: 2400 / 470; flex-shrink: 0; background: #4f3b18 url('img/hud_top.png?v=47') center / 100% 100% no-repeat; z-index: 1; }
.top-road { width: 100%; aspect-ratio: 877 / 118; flex-shrink: 0; background: #557a32 url('img/ui_top_road.png') center / 100% 100% no-repeat; pointer-events: none; }
/* Счётчики стоят сразу справа от иконки на картинке и не заходят в соседнюю секцию. */
.val-box { position: absolute; top: 11%; height: 30%; display: flex; align-items: center; justify-content: flex-start; pointer-events: none; overflow: visible; }
#score-box { left: 8.3%; width: 20.0%; }
#coins-box { left: 38.0%; width: 19.6%; }
#moves-box { left: 67.4%; width: 19.4%; }

.hitbox { position: absolute; cursor: pointer; border-radius: 12px; }
.hit-rating { left: 0; top: 48.3%; width: 28.92%; height: 51.7%; cursor: pointer; }
.hit-shop { left: 29.58%; top: 48.3%; width: 28.55%; height: 51.7%; }
.hit-pause { left: 58.79%; top: 48.3%; width: 28.59%; height: 51.7%; }
.hit-down { position: absolute; left: 88.04%; width: 11.96%; top: 48.3%; height: 51.7%; cursor: pointer; z-index: 2; }
/* Правая плитка: юрист по центру над стрелкой, низ фигурки сразу над стрелкой, целиком внутри плитки. */
.hit-jurist { position: absolute; left: 88.25%; width: 11.7%; top: 0.6%; height: 62.6%; z-index: 3; overflow: visible; }
.hit-jurist.cooling, .hit-jurist.empty { cursor: default; }
.hit-jurist.empty img, .hit-jurist.empty .jurist-ring { visibility: hidden; }
.hit-jurist img { position: absolute; left: 0; top: 0; width: 0; height: 0; object-fit: fill; pointer-events: none; z-index: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
.jurist-ring { position: absolute; left: 0; top: 0; display: none; pointer-events: none; z-index: 0; overflow: visible; }
.jurist-ring.on { display: block; }
.jurist-ring-track, .jurist-ring-fill { fill: none; stroke-linecap: round; }
.jurist-ring-track { stroke: rgba(255,255,255,0.18); stroke-width: 4.5; }
.jurist-ring-fill { stroke: rgba(255,255,255,0.55); stroke-width: 4.5; transform-origin: 50px 50px; transform: rotate(-90deg); }
@keyframes juristSway {
0% { transform: rotate(0deg); }
20% { transform: rotate(-11deg); }
50% { transform: rotate(0deg); }
78% { transform: rotate(12deg); }
100% { transform: rotate(0deg); }
}
.hit-jurist img.sway { transform-origin: var(--sway-ox, 50%) var(--sway-oy, 84%); animation: juristSway 0.7s ease-in-out 2; }

/* Золотые цифры-спрайты. Одна высота на все три счётчика, слот одной ширины, чтобы число не прыгало. */
.num-container {
  display: flex; align-items: center; justify-content: flex-start;
  height: 100%; width: 100%; min-width: 0;
  line-height: 0;
}
.hud-digit {
  flex: 0 0 var(--digit-slot, 10px);
  width: var(--digit-slot, 10px);
  height: var(--digit-h, 12px);
  display: flex; align-items: flex-end; justify-content: center;
}
.hud-glyph {
  display: block;
  background-repeat: no-repeat;
  pointer-events: none;
}

/* ПОЛЕ. На всю ширину и на всю высоту от полоски травы под дорогой до нижней панели.
   Клетки выше, чем шире, когда вьюпорт это позволяет. Сверху и снизу одинаковый узкий зазор. */
.playfield { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; padding: 4px 0; background: linear-gradient(#557a32, #557a32) top / 100% 4px no-repeat; background-color: transparent; position: relative; z-index: 3; }
#board { width: 100%; flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 0; background: url('img/board_bg.png') center / 100% 100% no-repeat; border: none; touch-action: none; position: relative; }
.cell { background: transparent; display: flex; align-items: center; justify-content: center; position: relative; overflow: visible; z-index: 1; }
#shades { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); pointer-events: none; z-index: 0; }
.shade { background: rgba(40, 25, 10, 0.35); opacity: 0; transition: opacity 250ms ease; border-radius: 0; }
.shade.on { opacity: 1; }
#shades.no-anim .shade { transition: none; }
.ghost { position: fixed; left: 0; top: 0; display: block; background: none; pointer-events: none; z-index: 2000; overflow: visible; will-change: transform; transition: none; }
.ghost::after { content: ''; position: absolute; left: 52%; top: 82%; width: 34%; height: 16%; background: rgba(0, 0, 0, 0.45); border-radius: 50%; filter: blur(3px); z-index: 0; pointer-events: none; }
.piece { position: absolute; left: calc(50% + var(--piece-dx, 0px)); top: 50%; transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)); display: block; pointer-events: none; z-index: 1; }
.piece img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; position: static; transform: none; }
.piece.piece-emoji { font-size: 32px; line-height: 1; display: flex; align-items: center; justify-content: center; }

/* АНИМАЦИИ */
@keyframes piece-pop { 0% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(0); } 60% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1.15); } 100% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1); } }
.piece.piece-pop { animation: piece-pop 0.35s ease-out both; }
@keyframes land-bounce { 0% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1.22, 0.72); } 45% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(0.9, 1.14); } 100% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1, 1); } }
.piece.land-bounce { animation: land-bounce 0.12s ease-out both; }
.merge-glow { position: fixed; z-index: 2080; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,226,90,0.9) 32%, rgba(255,196,40,0.35) 58%, rgba(255,196,40,0) 72%); animation: glowFlash 0.4s ease-out forwards; }
@keyframes glowFlash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.25); } 28% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); } }
.score-float { position: fixed; z-index: 2200; pointer-events: none; font-weight: 900; font-size: 22px; color: #ffe14a; -webkit-text-stroke: 3px #111; paint-order: stroke fill; text-shadow: 0 1px 0 #000; transform: translate(-50%, 0); animation: scoreFloat 1s ease-out forwards; }
@keyframes scoreFloat { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -52px); } }
.nano-closed { width: 100%; height: 100%; display: block; }
@keyframes merge-pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); filter: drop-shadow(0 0 12px #ffd700); } 100% { transform: translate(-50%, -50%) scale(1); } }
.cell.merge-hint img, .cell.merge-hint span, .ghost.merge-hint { animation: merge-pulse 0.48s infinite ease-in-out; z-index: 10; }
@keyframes printer-print { 0% { filter: brightness(1); } 50% { filter: brightness(2) drop-shadow(0 0 15px #00ffff); transform: translate(-50%, -50%) scale(1.1); } 100% { filter: brightness(1); } }
.cell.printer-print img, .cell.printer-print span { animation: printer-print 0.5s ease-in-out; }
@keyframes omonFade { 0% { opacity: 0; } 100% { opacity: 1; } }
.cell.anim-omon { animation: omonFade 0.4s ease-in; }

/* НИЗ. Три прозрачные коробки лежат на том же лесу, что и верх (#app). Отдельной картинки и плитки нет. */
.bottom-panel {
  position: relative;
  z-index: 2;
  width: 100%;
  height: calc(100cqw * 768 / 2544 + var(--ui-bottom));
  margin-top: 0;
  overflow: visible;
  flex-shrink: 0;
  background: transparent;
}
.bottom-forest {
  position: absolute;
  left: 0;
  right: 0;
  top: -4px;
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background: none;
}
.bottom-art {
  position: relative;
  z-index: 1;
  width: 100%;
  height: calc(100cqw * 768 / 2544);
  background: none;
}
.jail-block { position: absolute; left: 2.36%; top: 3.78%; width: 22.25%; height: 83.85%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.next-block { position: absolute; left: 31.05%; top: 4.43%; width: 25.63%; height: 85.55%; cursor: grab; display: flex; align-items: center; justify-content: center; }
.hint-block { position: absolute; left: 60.89%; top: 4.43%; width: 36.99%; height: 85.55%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.jail-block .content, .next-block .content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.tray-fill {
  position: absolute;
  inset: 1.5%;
  border-radius: 9% / 7%;
  background: rgba(235, 240, 215, 0.35);
  pointer-events: none;
  z-index: 0;
}
.tray-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  z-index: 2;
}

#log { display: none !important; }

/* МОДАЛКИ ОБЩИЕ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
.modal.open { display: flex; }
.modal-content { background: #2b1a0e; border: 3px solid #ffd700; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.modal h2 { text-align: center; color: #ffd700; margin-bottom: 15px; }
.close-btn { width: 100%; padding: 12px; margin-top: 10px; background: #8b3a3a; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

/* Магазин и пауза — одно компактное окно по центру затемнённого поля. */
.shop-modal, #pause-modal.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center; z-index: 2600; padding: 8px; }
.shop-modal.open, #pause-modal.modal.open { display: flex; }
.sheet {
  width: min(70vw, calc((100dvh - var(--ui-top) - var(--ui-bottom) - 20px) / 2.35));
  aspect-ratio: 1 / 2.35;
  max-height: calc(100dvh - var(--ui-top) - var(--ui-bottom) - 12px);
  background: #e7f2c4;
  border: 3px solid #3d4e28;
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.sheet-bar { flex: 0 0 auto; background: #6f8b46; color: #fff6c4; min-height: 38px; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 900; letter-spacing: 0.08em; font-size: 16px; text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
.sheet-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 48px; height: 32px; border-radius: 8px; border: 2px solid #3a2a10; background: #ffd24a; color: #2b1a0e; font-size: 22px; font-weight: 900; line-height: 1; cursor: pointer; padding: 0; }
/* Магазинчик и пауза — одна и та же рамка: ширина ≈ половина экрана, пропорция 570×1438, верх сразу под рядом кнопок HUD. */
.shop-window, .pause-window {
  --buttons-bottom: calc(max(var(--ui-top), 100cqw * 137 / 877) + 100cqw * 470 / 2400);
  --panel-top: calc(var(--buttons-bottom) + 8px);
  --bottom-panel-top: calc(100dvh - var(--ui-bottom) - 100cqw * 768 / 2544);
  --panel-room: calc(var(--bottom-panel-top) - var(--panel-top) - 10px);
  position: absolute;
  left: 50%;
  top: var(--panel-top);
  transform: translateX(-50%);
  width: min(50vw, calc(var(--panel-room) * 570 / 1438));
  aspect-ratio: 570 / 1438;
}
.shop-window {
  background: #d7d8ae url('img/shop_bg.png?v=54') center / 100% 100% no-repeat;
  border-radius: calc(50vw * 20 / 570);
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}
.shop-hitbox { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; border-radius: 16px; }
.shop-hitbox:active { background: rgba(255,255,255,0.18); }
.shop-hitbox[aria-disabled="true"] { cursor: default; }
.shop-hitbox[aria-disabled="true"]:active { background: transparent; }
.slot-1 { top: 8.97%; left: 7.19%; width: 38.42%; height: 15.37%; }
.slot-2 { top: 8.97%; left: 55.09%; width: 37.89%; height: 15.37%; }
.slot-3 { top: 27.05%; left: 7.19%; width: 38.42%; height: 15.37%; }
.slot-4 { top: 27.05%; left: 55.09%; width: 37.89%; height: 15.37%; }
.slot-5 { top: 45.13%; left: 7.19%; width: 38.42%; height: 15.44%; }
.slot-6 { top: 45.13%; left: 55.09%; width: 37.89%; height: 15.44%; }
.slot-7 { top: 63.28%; left: 7.19%; width: 38.42%; height: 15.58%; }
.slot-8 { top: 63.28%; left: 55.09%; width: 37.89%; height: 15.58%; }
.slot-9 { top: 81.64%; left: 7.19%; width: 38.42%; height: 15.65%; }
.slot-10 { top: 81.64%; left: 55.09%; width: 37.89%; height: 15.65%; }
.slot-close { top: 1.53%; left: 84.21%; width: 12.81%; height: 4.87%; border-radius: 10px; }
/* Красный штамп «ПРОПЛАЧЕНО» поверх слова «КУПИТЬ». Ширина ~118% слота, центр на слове. */
.shop-paid {
  display: none;
  position: absolute;
  z-index: 4;
  pointer-events: none;
  width: calc(38.42% * 1.18);
  height: auto;
  left: calc(7.19% + 38.42% / 2);
  transform: translate(-50%, -50%);
}
.shop-paid.on { display: block; }
.shop-paid.for-jurist { top: 76.6%; }
.shop-paid.for-statue { top: 95%; }
.shop-voter-art {
  display: none;
  position: absolute;
  z-index: 1;
  pointer-events: none;
  left: calc(7.19% + 38.42% * 0.06);
  top: calc(27.05% + 15.37% * 0.02);
  width: calc(38.42% * 0.88);
  height: calc(15.37% * 0.68);
  object-fit: contain;
  object-position: center center;
  background: #979765;
  border-radius: 10px;
}
.shop-voter-art.on { display: block; }
.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
/* Пауза растянута до размера магазина. Верх (шапка и кнопки) и низ (f / лайк / звезда) не искажаются, тянется только оливковая середина. */
.pause-window {
  display: flex;
  flex-direction: column;
  border-radius: 2.2% / 1.2%;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  overflow: hidden;
  background: #c5c6a0;
}
/* Размер как на референсе: ~78% ширины экрана, сверху 17% до 83% высоты, по центру.
   Верх и низ держат пропорции исходных картинок (902×430 и 902×390), тянется середина. */
#pause-modal .pause-window {
  top: 17dvh;
  width: 78vw;
  height: 66dvh;
  aspect-ratio: auto;
  max-height: none;
}
#pause-modal .pause-top { height: calc(78vw * 430 / 902); flex-basis: auto; }
#pause-modal .pause-bot { height: calc(78vw * 390 / 902); flex-basis: auto; }
.pause-top, .pause-mid, .pause-bot { position: relative; width: 100%; background-repeat: no-repeat; }
.pause-top { flex: 0 0 auto; height: calc(100% * 430 / 902 * 570 / 1438); background-image: url('img/pause_top.png?v=47'); background-size: 100% 100%; }
.pause-bot { flex: 0 0 auto; height: calc(100% * 390 / 902 * 570 / 1438); background-image: url('img/pause_bot.png?v=47'); background-size: 100% 100%; }
.pause-mid { flex: 1 1 auto; min-height: 0; background-image: url('img/pause_mid.png?v=47'); background-size: 100% 100%; }
.pause-undo { left: 6.76%; top: 47.22%; width: 18.74%; height: 42.79%; }
.pause-list { left: 29.82%; top: 47.22%; width: 18.74%; height: 42.79%; }
.pause-restart { left: 52.66%; top: 47.22%; width: 18.63%; height: 42.79%; }
.pause-play { left: 75.50%; top: 47.22%; width: 18.40%; height: 42.79%; }
.pause-fb { left: 9.76%; top: 7.45%; width: 21.06%; height: 72.29%; }
.pause-like { left: 39.25%; top: 7.45%; width: 21.06%; height: 72.53%; }
.pause-star { left: 68.07%; top: 7.45%; width: 20.95%; height: 72.04%; }
#pause-modal {
  --buttons-bottom: calc(max(var(--ui-top), 100cqw * 137 / 877) + 100cqw * 470 / 2400);
  --panel-top: calc(var(--buttons-bottom) + 8px);
  --bottom-panel-top: calc(100dvh - var(--ui-bottom) - 100cqw * 768 / 2544);
  --panel-room: calc(var(--bottom-panel-top) - var(--panel-top) - 10px);
  --pause-w: min(50vw, calc(var(--panel-room) * 570 / 1438));
}
.pause-leave {
  position: absolute;
  left: 50%;
  z-index: 3;
  transform: translateX(-50%);
  top: calc(var(--panel-top) + var(--pause-w) * 1438 / 570 + 8px);
  width: var(--pause-w);
  padding: 10px 8px;
  border-radius: 10px;
  border: 2px solid #3e4a28;
  background: #ffe08a;
  color: #2b1a0e;
  font-weight: 900;
  font-size: 15px;
  cursor: pointer;
}
.pause-missions {
  position: absolute;
  left: 4%;
  width: 92%;
  top: 3%;
  bottom: 3%;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 2%;
  pointer-events: none;
}
.pause-missions img { width: 100%; min-height: 0; flex: 1 1 0; object-fit: contain; object-position: center; display: block; }

/* ПОЧТА */
.mail-card { width: 100%; cursor: pointer; position: relative; margin-bottom: 8px;}

@keyframes pieceWalk {
0% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 1), calc(var(--dy) * 1)) rotate(0deg); }
5% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9952), calc(var(--dy) * 0.9952)) rotate(-3.71deg); }
10% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9803), calc(var(--dy) * 0.9803)) rotate(-7.05deg); }
15% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9548), calc(var(--dy) * 0.9548)) rotate(-9.71deg); }
20% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9183), calc(var(--dy) * 0.9183)) rotate(-11.41deg); }
25% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.8708), calc(var(--dy) * 0.8708)) rotate(-12deg); }
30% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.8126), calc(var(--dy) * 0.8126)) rotate(-11.41deg); }
35% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.7445), calc(var(--dy) * 0.7445)) rotate(-9.71deg); }
40% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.6681), calc(var(--dy) * 0.6681)) rotate(-7.05deg); }
45% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.5857), calc(var(--dy) * 0.5857)) rotate(-3.71deg); }
50% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5)) rotate(0deg); }
55% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.4143), calc(var(--dy) * 0.4143)) rotate(3.71deg); }
60% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.3319), calc(var(--dy) * 0.3319)) rotate(7.05deg); }
65% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.2555), calc(var(--dy) * 0.2555)) rotate(9.71deg); }
70% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.1874), calc(var(--dy) * 0.1874)) rotate(11.41deg); }
75% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.1292), calc(var(--dy) * 0.1292)) rotate(12deg); }
80% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0817), calc(var(--dy) * 0.0817)) rotate(11.41deg); }
85% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0452), calc(var(--dy) * 0.0452)) rotate(9.71deg); }
90% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0197), calc(var(--dy) * 0.0197)) rotate(7.05deg); }
95% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0048), calc(var(--dy) * 0.0048)) rotate(3.71deg); }
100% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0), calc(var(--dy) * 0)) rotate(0deg); }
}

mv = typeof save.moves === 'number' ? save.moves : 0;

const NUM_NAT = 1254;
const DIGIT_BOX = [
[151, 54, 1110, 1206],

];
const DIGIT_SLOT_ASPECT = DIGIT_BOX.reduce((m, b) => Math.max(m, (b[2] - b[0]) / (b[3] - b[1])), 0);
function paintGlyph(g, i) {
const b = DIGIT_BOX[i];
const visW = b[2] - b[0], visH = b[3] - b[1];
g.style.width = 'calc(var(--digit-h) * ' + (visW / visH).toFixed(5) + ')';
g.style.height = 'var(--digit-h)';
const full = (NUM_NAT / visH).toFixed(5);
g.style.backgroundSize = 'calc(var(--digit-h) * ' + full + ') calc(var(--digit-h) * ' + full + ')';
g.style.backgroundPosition = 'calc(var(--digit-h) * ' + (-b[0] / visH).toFixed(5) + ') calc(var(--digit-h) * ' + (-b[1] / visH).toFixed(5) + ')';
g.style.backgroundImage = "url('img/num_" + i + ".png')";
}
function makeDigit(ch) {
const slot = document.createElement('span');
slot.className = 'hud-digit';
slot.dataset.d = ch;
const g = document.createElement('span');
g.className = 'hud-glyph';
paintGlyph(g, ch.charCodeAt(0) - 48);
slot.appendChild(g);
return slot;
}
function setDigits(el, value) {
if (!el) return;
const text = String(Math.max(0, value | 0));
const slots = el.children;
if (slots.length === text.length) {
for (let i = 0; i < text.length; i++) {
if (slots[i].dataset.d === text[i]) continue;
slots[i].dataset.d = text[i];
paintGlyph(slots[i].firstChild, text.charCodeAt(i) - 48);
}
return;
}
const frag = document.createDocumentFragment();
for (let i = 0; i < text.length; i++) frag.appendChild(makeDigit(text[i]));
el.replaceChildren(frag);
}
function paintHud() {

let hudLayoutKey = '';
function layoutHudDigits() {
const boxes = ['score-box', 'coins-box', 'moves-box'].map(id => document.getElementById(id));
if (boxes.some(b => !b || !b.clientWidth)) return;
const key = boxes.map(b => b.clientWidth + 'x' + b.clientHeight).join('|');
if (key === hudLayoutKey) return;
hudLayoutKey = key;
const counts = [9, 8, 6];
let h = Infinity;
boxes.forEach((box, i) => {
h = Math.min(h, (box.clientWidth - 1) / (counts[i] * DIGIT_SLOT_ASPECT), box.clientHeight);
});
if (!isFinite(h)) return;
h = Math.max(6, h);
const root = document.documentElement.style;
root.setProperty('--digit-h', h.toFixed(2) + 'px');
root.setProperty('--digit-slot', (h * DIGIT_SLOT_ASPECT).toFixed(2) + 'px');
}

paintHud();
layoutHudDigits();
return;

paintHud();
layoutHudDigits();
return;
}
const fromS = hudView.score, fromC = hudView.coins;
const toS = score, toC = coins;
hudGoal.score = toS;
hudGoal.coins = toC;
const t0 = performance.now();
const token = ++hudAnimToken;
function frame(now) {
if (token !== hudAnimToken) return;
const t = Math.min(1, (now - t0) / 350);
hudView.score = Math.round(fromS + (toS - fromS) * t);
hudView.coins = Math.round(fromC + (toC - fromC) * t);
paintHud();
layoutHudDigits();
if (t < 1) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
layoutHudDigits();
}

function measureTrim(img) {
const w = img.naturalWidth, h = img.naturalHeight;
if (!w || !h) return { l: 0, t: 0, r: 1, b: 1, natW: w || 1, natH: h || 1 };
const max = 180;
const s = Math.min(1, max / Math.max(w, h));
const c = document.createElement('canvas');
c.width = Math.max(1, Math.round(w * s));
c.height = Math.max(1, Math.round(h * s));
const ctx = c.getContext('2d', { willReadFrequently: true });
ctx.drawImage(img, 0, 0, c.width, c.height);
let data;
try { data = ctx.getImageData(0, 0, c.width, c.height).data; }
catch (e) { return { l: 0, t: 0, r: 1, b: 1, natW: w, natH: h }; }
let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
for (let y = 0; y < c.height; y++) {
for (let x = 0; x < c.width; x++) {
if (data[(y * c.width + x) * 4 + 3] > 16) {
if (x < minX) minX = x;
if (y < minY) minY = y;
if (x > maxX) maxX = x;
if (y > maxY) maxY = y;
}
}
}
if (maxX < 0) return { l: 0, t: 0, r: 1, b: 1, natW: w, natH: h };
return { l: minX / c.width, t: minY / c.height, r: (maxX + 1) / c.width, b: (maxY + 1) / c.height, natW: w, natH: h };
}

function visualCenterOffset(src) {
const trim = TRIM[bareSrc(src)];
const box = cellSize();
if (!trim) return { x: 0, y: 0 };
const limit = 0.92 * Math.min(box.w, box.h);
const cW = Math.max(1, (trim.r - trim.l) * trim.natW);
const cH = Math.max(1, (trim.b - trim.t) * trim.natH);
const s = limit / Math.max(cW, cH);
const dispW = trim.natW * s;
const dispH = trim.natH * s;
return {
x: ((trim.l + trim.r) / 2 - 0.5) * dispW,
y: ((trim.t + trim.b) / 2 - 0.5) * dispH
};
}

function alignSheep(wrap) {
const voterSrc = voterChannel ? 'img/pasha_03.png' : 'img/voter-grandpa.png';
if (!TRIM['img/sheep-src.png'] || !TRIM[voterSrc]) return;
const sheep = visualCenterOffset('img/sheep-src.png');
const voter = visualCenterOffset(voterSrc);
wrap.style.setProperty('--piece-dx', (voter.x - sheep.x).toFixed(2) + 'px');
wrap.style.setProperty('--piece-dy', (voter.y - sheep.y).toFixed(2) + 'px');
}

function bareSrc(src) {
return src ? String(src).split('?')[0] : src;
}
function pieceDisplaySize(src, cellW, cellH) {
/* Статуя: белая обводка — часть картинки, не обрезаем. Высота 1.012 клетки, ширина по пропорции 260×512. */
if (bareSrc(src) === STATUE_SRC) {
const h = cellH * 1.012;
return { w: h * STATUE_ASPECT, h: h };
}
const limit = 0.92 * Math.min(cellW, cellH);
const trim = src && TRIM[bareSrc(src)];
if (!trim) return { w: limit, h: limit };

let masterGain = null;
let audioGen = 0;
const audioLoopMakers = new Map();
const audioLoopNodes = new Map();

function audioBus(ctx) {
if (masterGain && ctx === audioCtx) return masterGain;
return ctx.destination;
}

function stopAudioLoops() {
audioLoopNodes.forEach(node => {
try { if (node.stop) node.stop(); } catch (e) {}
try { if (node.disconnect) node.disconnect(); } catch (e) {}
});
audioLoopNodes.clear();
}

function startAudioLoops(ctx) {
stopAudioLoops();
if (!ctx || !masterGain || sfxMuted) return;
audioLoopMakers.forEach((maker, name) => {
try {
const node = maker(ctx, masterGain);
if (node) audioLoopNodes.set(name, node);
} catch (e) {}
});
}

/* Единственная точка для фоновой петли: при пересоздании контекста старая петля
   гасится и стартует ровно одна новая, без наложения. */
function addAudioLoop(name, maker) {
audioLoopMakers.set(name, maker);
if (!audioCtx || audioCtx.state === 'closed' || sfxMuted || !masterGain) return;
const prev = audioLoopNodes.get(name);
if (prev) {
try { if (prev.stop) prev.stop(); } catch (e) {}
audioLoopNodes.delete(name);
}
try {
const node = maker(audioCtx, masterGain);
if (node) audioLoopNodes.set(name, node);
} catch (e) {}
}

function markAudioStale() {
audioStale = true;
suspendAudio();
}
function unlockAudioContext(ctx) {
try {
const buf = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
const src = ctx.createBufferSource();
src.buffer = buf;
const g = ctx.createGain();
g.gain.value = 0;
src.connect(g);
g.connect(ctx.destination);
src.start(0);
} catch (e) {}
if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
try {
const p = ctx.resume();
if (p && typeof p.catch === 'function') p.catch(function () {});
} catch (e) {}
}
}
function createAudio() {
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return null;
const gen = ++audioGen;
stopAudioLoops();
const prev = audioCtx;
audioCtx = null;
masterGain = null;
if (prev && prev.state !== 'closed') {
try { prev.close(); } catch (e) {}
}
let ctx;
try { ctx = new AC(); } catch (e) { return null; }
if (gen !== audioGen) {
try { ctx.close(); } catch (e) {}
return audioCtx;
}
unlockAudioContext(ctx);
const bus = ctx.createGain();
bus.gain.value = sfxMuted ? 0 : 1;
bus.connect(ctx.destination);
audioCtx = ctx;
masterGain = bus;
audioStale = false;
audioHeld = false;
if (!sfxMuted) startAudioLoops(ctx);
return ctx;
}

function restartMusic(ctx) {
if (sfxMuted || !ctx || ctx.state !== 'running' || !masterGain) return;
if (!audioLoopMakers.size) return;
startAudioLoops(ctx);
}

function onAudioGesture() {
if (sfxMuted) return;
const ctx = audioCtx;
const bad = audioStale || !ctx || ctx.state === 'closed' || ctx.state === 'interrupted' || ctx.state === 'suspended';
if (!bad) return;
createAudio();
}
function ensureAudio() {
if (sfxMuted) return null;
const ctx = audioCtx;
if (audioStale || !ctx || ctx.state === 'closed' || ctx.state === 'interrupted' || ctx.state === 'suspended' || ctx.state !== 'running') return null;
return ctx;
}

function resumeAudio() {
if (sfxMuted) return;
const ctx = audioCtx;
if (audioStale || !ctx || ctx.state === 'closed' || ctx.state === 'interrupted' || ctx.state === 'suspended') {
audioStale = true;
return;
}
if (ctx.state === 'running' && audioHeld) restartMusic(ctx);
audioHeld = false;
}

function suspendAudio() {
audioHeld = true;
const ctx = audioCtx;
if (!ctx || ctx.state !== 'running') return;
try {
const p = ctx.suspend();
if (p && typeof p.catch === 'function') p.catch(function () {});
} catch (e) {}
}

function envTone(ctx, freq, t, dur, type, gain) {
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = type;
o.frequency.setValueAtTime(freq, t);
g.gain.setValueAtTime(gain, t);
g.gain.exponentialRampToValueAtTime(0.001, t + dur);
o.connect(g); g.connect(audioBus(ctx));
o.start(t); o.stop(t + dur + 0.02);
}

function sfx(name) {
const ctx = ensureAudio();
if (!ctx) return;
const t = ctx.currentTime;
if (name === 'place') {
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(160, t);
o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
g.gain.setValueAtTime(0.28, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
o.connect(g); g.connect(audioBus(ctx));
o.start(t); o.stop(t + 0.15);
} else if (name === 'merge') {
envTone(ctx, 523, t, 0.12, 'sine', 0.16);
envTone(ctx, 659, t + 0.07, 0.14, 'sine', 0.14);
envTone(ctx, 784, t + 0.14, 0.18, 'triangle', 0.12);
} else if (name === 'step') {
envTone(ctx, 990, t, 0.035, 'square', 0.03);
} else if (name === 'ui') {
envTone(ctx, 740, t, 0.045, 'square', 0.04);
} else if (name === 'trap') {
marimbaNote(ctx, t, 698, 0.2, 0.2);
marimbaNote(ctx, t + 0.13, 466, 0.22, 0.18);
} else if (name === 'pop') {
corkPop(ctx, t);
} else if (name === 'saw') {
sawStroke(ctx, t);
sawStroke(ctx, t + 0.5);
sawDing(ctx, t + 1.02);
} else if (name === 'weed') {
weedStab(ctx, t);
weedStab(ctx, t + 0.09);
} else if (name === 'juristFree') {
juristApplause(ctx, t);
}
}
function juristApplause(ctx, t) {
[0, 0.11, 0.22, 0.34, 0.47, 0.58, 0.72].forEach((dt, i) => {
const g = 0.26 + (i % 2) * 0.07;
noiseBurst(ctx, t + dt, 0.05, 2100, 640, g, 0.85);
noiseBurst(ctx, t + dt + 0.01, 0.03, 1200, 380, g * 0.4, 1.5);
});
noiseBurst(ctx, t + 0.04, 0.8, 1600, 480, 0.045, 0.5);
juristWow(ctx, t + 0.2);

function juristWow(ctx, t) {
const osc = ctx.createOscillator();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(128, t);
osc.frequency.linearRampToValueAtTime(206, t + 0.16);
osc.frequency.linearRampToValueAtTime(146, t + 0.5);

master.gain.setValueAtTime(0.0001, t);
master.gain.exponentialRampToValueAtTime(0.2, t + 0.05);
master.gain.setValueAtTime(0.16, t + 0.24);
master.gain.exponentialRampToValueAtTime(0.0001, t + 0.52);

const f = ctx.createBiquadFilter();
f.type = 'bandpass';
f.Q.value = spec[2];
f.frequency.setValueAtTime(spec[0], t);
f.frequency.linearRampToValueAtTime(spec[1], t + 0.42);
const g = ctx.createGain();
g.gain.value = spec[3];
osc.connect(f); f.connect(g); g.connect(master);

master.connect(audioBus(ctx));
osc.start(t); osc.stop(t + 0.56);
}

function corkPop(ctx, t) {
noiseBurst(ctx, t, 0.07, 1400, 280, 0.42, 0.8);
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(480, t);
o.frequency.exponentialRampToValueAtTime(120, t + 0.08);
g.gain.setValueAtTime(0.2, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

function noiseBurst(ctx, t, dur, fromFreq, toFreq, gainVal, q) {
const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
const data = buf.getChannelData(0);
for (let i = 0; i < frames; i++) {
const p = i / frames;
data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * p);
}
const src = ctx.createBufferSource();
src.buffer = buf;
const f = ctx.createBiquadFilter();
f.type = 'bandpass';
f.Q.value = q || 3;
f.frequency.setValueAtTime(fromFreq, t);
f.frequency.exponentialRampToValueAtTime(Math.max(40, toFreq), t + dur);
const g = ctx.createGain();
g.gain.setValueAtTime(0.0001, t);
g.gain.linearRampToValueAtTime(gainVal, t + Math.min(0.025, dur * 0.15));
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
src.connect(f); f.connect(g); g.connect(audioBus(ctx));
src.start(t);
src.stop(t + dur + 0.02);
}

function startAchSpark() {
const canvas = document.getElementById('ach-spark');
if (!canvas || achReduced()) return;
const stage = canvas.parentElement;
const w = (stage && stage.clientWidth) || 280;
const h = (stage && stage.clientHeight) || 280;
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = Math.round(w * 1.6 * dpr);
canvas.height = Math.round(h * 1.6 * dpr);
const ctx = canvas.getContext('2d');
if (!ctx) return;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const W = canvas.width / dpr, H = canvas.height / dpr;
const cx = W / 2, cy = H / 2;
const colors = ['#fff', '#ffe28a', '#fff6d2', '#ffd24a', '#fff'];
const bits = [];
for (let i = 0; i < 72; i++) {
const ang = Math.random() * Math.PI * 2;
const speed = 70 + Math.random() * 220;
bits.push({
x: cx, y: cy,
vx: Math.cos(ang) * speed,
vy: Math.sin(ang) * speed,
g: 40 + Math.random() * 80,
life: 0.9 + Math.random() * 1.5,
age: 0,
size: 2 + Math.random() * 3.4,
rot: Math.random() * Math.PI,
spin: (Math.random() - 0.5) * 8,
color: colors[i % colors.length],
tw: Math.random() * Math.PI * 2
});
}
const state = { stop: false };
achSpark = state;
let last = performance.now();
function frame(now) {
if (state.stop) return;
const dt = Math.min(0.05, (now - last) / 1000);
last = now;
ctx.clearRect(0, 0, W, H);
let alive = false;
bits.forEach(p => {
p.age += dt;
if (p.age > p.life) return;
alive = true;
p.vy += p.g * dt;
p.x += p.vx * dt;
p.y += p.vy * dt;
p.rot += p.spin * dt;
const k = 1 - p.age / p.life;
const tw = 0.45 + 0.55 * Math.abs(Math.sin(p.tw + p.age * 14));
ctx.save();
ctx.translate(p.x, p.y);
ctx.rotate(p.rot);
ctx.globalAlpha = Math.max(0, k) * tw;
ctx.fillStyle = p.color;
ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8);
ctx.restore();
});
if (alive) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}

(function bindNewUi() {
const bx = document.getElementById('cellar-x');
if (bx) bx.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); closeCellar(); });
const cellar = document.getElementById('cellar');
if (cellar) {
let swipe = null;
cellar.addEventListener('pointerdown', function (e) {
if (e.target.closest && e.target.closest('#cellar-x, .cellar-dot')) return;
swipe = { id: e.pointerId, x: e.clientX, page: cellarPage };
});
cellar.addEventListener('pointerup', function (e) {
if (!swipe || e.pointerId !== swipe.id) return;
const dx = e.clientX - swipe.x;
const pages = Math.max(1, Math.ceil(ACHIEVEMENTS.length / 9));
if (dx < -40 && swipe.page < pages - 1) { cellarPage = swipe.page + 1; renderCellar(); }
else if (dx > 40 && swipe.page > 0) { cellarPage = swipe.page - 1; renderCellar(); }
swipe = null;
});
cellar.addEventListener('pointercancel', function () { swipe = null; });
}
