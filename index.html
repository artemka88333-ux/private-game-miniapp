<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7e6829">
<title>Демократия — Финал</title>
<link rel="preload" as="image" href="img/loading.jpg" fetchpriority="high">
<style id="boot-css">
html, body { margin: 0; background: #6a7a72; }
#boot { position: fixed; inset: 0; z-index: 6000; background: #6a7a72; transition: opacity 0.3s ease; }
#boot img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
#boot.hide { opacity: 0; pointer-events: none; }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; -webkit-touch-callout: none; }
*:focus, *:active { outline: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; user-select: none; touch-action: none; background: #7e6829; overscroll-behavior: none; }
body { background: #7e6829; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; height: 100dvh; }
/* Telegram writes --tg-safe-area-inset-* and --tg-content-safe-area-inset-* from WebApp.safeAreaInset / contentSafeAreaInset. Content inset is the Telegram chrome only, so it is added to the device inset. env() covers the same device inset when the client has not reported one yet. */
:root {
  --ui-top: calc(max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
  --ui-right: calc(max(env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px)) + var(--tg-content-safe-area-inset-right, 0px));
  --ui-bottom: calc(max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px)) + var(--tg-content-safe-area-inset-bottom, 0px));
  --ui-left: calc(max(env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px)) + var(--tg-content-safe-area-inset-left, 0px));
}
#app { --forest-lift: max(0px, calc(var(--ui-top) - 100cqw * 137 / 877)); width: 100%; max-width: 480px; height: 100vh; height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #7e6829; container-type: inline-size; padding-top: 0; padding-right: var(--ui-right); padding-bottom: 0; padding-left: var(--ui-left); }

#board { contain: layout paint; transform: translateZ(0); }
.bottom-panel { transform: translateZ(0); }

/* ВЕРХ. Лес тянется под шапку Telegram и не кликается. Под ним img/hud_top.png (кубок, монета, часы, аватар; подиум, магазин, пауза, стрелка). Дорога под панелью целиком: оба бордюра и полоска травы. */
.top-panel { position: relative; z-index: 2; width: 100%; flex-shrink: 0; margin-top: var(--forest-lift); display: flex; flex-direction: column; }
.top-forest { position: absolute; left: 0; right: 0; top: calc(-1 * var(--forest-lift)); height: calc(100cqw * 137 / 877 + var(--forest-lift)); background: #57732b url('img/ui_top_forest.png') center bottom / 100% calc(100cqw * 137 / 877) no-repeat; pointer-events: none; }
.top-hud { position: relative; width: 100%; margin-top: calc(100cqw * 137 / 877); aspect-ratio: 2400 / 470; flex-shrink: 0; background: #4f3b18 url('img/hud_top.png?v=47') center / 100% 100% no-repeat; z-index: 1; }
.top-road { width: 100%; aspect-ratio: 877 / 118; flex-shrink: 0; background: #557a32 url('img/ui_top_road.png') center / 100% 100% no-repeat; pointer-events: none; }
/* Счётчики стоят сразу справа от иконки на картинке и не заходят в соседнюю секцию. */
.val-box { position: absolute; top: 11%; height: 30%; display: flex; align-items: center; justify-content: flex-start; pointer-events: none; overflow: visible; }
#score-box { left: 8.3%; width: 20.0%; }
#coins-box { left: 38.0%; width: 19.6%; }
#moves-box { left: 67.4%; width: 19.4%; }

.hitbox { position: absolute; cursor: pointer; border-radius: 12px; }
.hit-rating { left: 0; top: 48.3%; width: 28.92%; height: 51.7%; cursor: default; }
.hit-shop { left: 29.58%; top: 48.3%; width: 28.55%; height: 51.7%; }
.hit-pause { left: 58.79%; top: 48.3%; width: 28.59%; height: 51.7%; }
.hit-down { position: absolute; left: 88.04%; width: 11.96%; top: 48.3%; height: 51.7%; cursor: pointer; z-index: 2; }
.hit-jurist { position: absolute; left: 88.6%; width: 10.6%; top: 3%; height: 42%; z-index: 3; overflow: visible; }
.hit-jurist.cooling { cursor: default; }
.hit-jurist img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); object-fit: contain; pointer-events: none; z-index: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
.jurist-ring { position: absolute; left: 50%; top: 50%; display: none; pointer-events: none; z-index: 0; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.55)); }
.jurist-ring.on { display: block; }
.jurist-ring-track, .jurist-ring-fill { fill: none; stroke-linecap: round; }
.jurist-ring-track { stroke: rgba(255,255,255,0.42); stroke-width: 5; }
.jurist-ring-fill { stroke: #fff; stroke-width: 5; transform-origin: 50px 50px; transform: rotate(-90deg); }
@keyframes juristSway {
0% { transform: translate(-50%, -50%) rotate(0deg); }
20% { transform: translate(-50%, -50%) rotate(-11deg); }
50% { transform: translate(-50%, -50%) rotate(0deg); }
78% { transform: translate(-50%, -50%) rotate(12deg); }
100% { transform: translate(-50%, -50%) rotate(0deg); }
}
.hit-jurist img.sway { transform-origin: var(--sway-ox, 50%) var(--sway-oy, 84%); animation: juristSway 0.7s ease-in-out 2; }

/* Один размер на все три счётчика. Цифры табличные, белые, с тёмной обводкой. */
.num-container {
  display: flex; align-items: center; justify-content: flex-start;
  height: 100%; width: 100%; min-width: 0;
  font-family: Inter, "Liberation Sans", "Nimbus Sans", Arial, sans-serif;
  font-weight: 800;
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
  font-size: calc(100cqw * 0.034);
  line-height: 1;
  letter-spacing: 0;
  white-space: nowrap;
  color: #fff;
  -webkit-text-stroke: 1px #1a1006;
  paint-order: stroke fill;
  text-shadow:
    0 1px 0 #140e06,
    1px 0 0 #140e06,
    -1px 0 0 #140e06,
    0 -1px 0 #140e06,
    1px 1px 0 #140e06,
    -1px 1px 0 #140e06,
    1px -1px 0 #140e06,
    -1px -1px 0 #140e06,
    0 2px 1px rgba(0,0,0,0.5);
}

/* ПОЛЕ. На всю ширину и на всю высоту от полоски травы под дорогой до нижней панели.
   Клетки выше, чем шире, когда вьюпорт это позволяет. Сверху и снизу одинаковый узкий зазор. */
.playfield { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; padding: 4px 0; background: linear-gradient(#557a32, #557a32) top / 100% 4px no-repeat; background-color: transparent; position: relative; z-index: 3; }
#board { width: 100%; flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 0; background: url('img/board_bg.png') center / 100% 100% no-repeat; border: none; touch-action: none; position: relative; }
.cell { background: transparent; display: flex; align-items: center; justify-content: center; position: relative; overflow: visible; z-index: 1; }
#shades { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); pointer-events: none; z-index: 0; }
.shade { background: rgba(40, 25, 10, 0.35); opacity: 0; transition: opacity 250ms ease; border-radius: 0; }
.shade.on { opacity: 1; }
#shades.no-anim .shade { transition: none; }
.ghost { position: fixed; left: 0; top: 0; display: block; background: none; pointer-events: none; z-index: 2000; overflow: visible; will-change: transform; transition: none; }
.ghost::after { content: ''; position: absolute; left: 52%; top: 82%; width: 34%; height: 16%; background: rgba(0, 0, 0, 0.45); border-radius: 50%; filter: blur(3px); z-index: 0; pointer-events: none; }
.piece { position: absolute; left: calc(50% + var(--piece-dx, 0px)); top: 50%; transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)); display: block; pointer-events: none; z-index: 1; }
.piece img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; position: static; transform: none; }
.piece.piece-emoji { font-size: 32px; line-height: 1; display: flex; align-items: center; justify-content: center; }

/* АНИМАЦИИ */
@keyframes piece-pop { 0% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(0); } 60% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1.15); } 100% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1); } }
.piece.piece-pop { animation: piece-pop 0.35s ease-out both; }
@keyframes land-bounce { 0% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1.22, 0.72); } 45% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(0.9, 1.14); } 100% { transform: translate(-50%, -50%) translateY(var(--piece-dy, 0px)) scale(1, 1); } }
.piece.land-bounce { animation: land-bounce 0.12s ease-out both; }
.merge-glow { position: fixed; z-index: 2080; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,226,90,0.9) 32%, rgba(255,196,40,0.35) 58%, rgba(255,196,40,0) 72%); animation: glowFlash 0.4s ease-out forwards; }
@keyframes glowFlash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.25); } 28% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); } }
.score-float { position: fixed; z-index: 2200; pointer-events: none; font-weight: 900; font-size: 22px; color: #ffe14a; -webkit-text-stroke: 3px #111; paint-order: stroke fill; text-shadow: 0 1px 0 #000; transform: translate(-50%, 0); animation: scoreFloat 1s ease-out forwards; }
@keyframes scoreFloat { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -52px); } }
.nano-closed { width: 100%; height: 100%; display: block; }
@keyframes merge-pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); filter: drop-shadow(0 0 12px #ffd700); } 100% { transform: translate(-50%, -50%) scale(1); } }
.cell.merge-hint img, .cell.merge-hint span, .ghost.merge-hint { animation: merge-pulse 0.48s infinite ease-in-out; z-index: 10; }
@keyframes printer-print { 0% { filter: brightness(1); } 50% { filter: brightness(2) drop-shadow(0 0 15px #00ffff); transform: translate(-50%, -50%) scale(1.1); } 100% { filter: brightness(1); } }
.cell.printer-print img, .cell.printer-print span { animation: printer-print 0.5s ease-in-out; }
@keyframes omonFade { 0% { opacity: 0; } 100% { opacity: 1; } }
.cell.anim-omon { animation: omonFade 0.4s ease-in; }

/* НИЗ. Тот же лес, что над шапкой, на всю нижнюю зону (включая 4px под полем и safe-area).
   Три коробки лежат сверху без своей зелёной подложки — между ними виден лес. */
.bottom-panel {
  position: relative;
  z-index: 2;
  width: 100%;
  height: calc(100cqw * 768 / 2544 + var(--ui-bottom));
  margin-top: 0;
  overflow: visible;
  flex-shrink: 0;
  background: transparent;
}
.bottom-panel::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: -4px;
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  background-color: #57732b;
  background-image: url('img/ui_top_forest.png');
  background-repeat: no-repeat;
  background-position: center 58%;
  background-size: 100% auto;
}
.bottom-art {
  position: relative;
  z-index: 1;
  width: 100%;
  height: calc(100cqw * 768 / 2544);
  background: url('img/hud_boxes.png?v=48') top center / 100% 100% no-repeat;
}
.jail-block { position: absolute; left: 2.36%; top: 3.78%; width: 22.25%; height: 83.85%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.next-block { position: absolute; left: 31.05%; top: 4.43%; width: 25.63%; height: 85.55%; cursor: grab; display: flex; align-items: center; justify-content: center; }
.hint-block { position: absolute; left: 60.89%; top: 4.43%; width: 36.99%; height: 85.55%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.jail-block .content, .next-block .content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

#log { display: none !important; }

/* МОДАЛКИ ОБЩИЕ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
.modal.open { display: flex; }
.modal-content { background: #2b1a0e; border: 3px solid #ffd700; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.modal h2 { text-align: center; color: #ffd700; margin-bottom: 15px; }
.close-btn { width: 100%; padding: 12px; margin-top: 10px; background: #8b3a3a; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

/* Магазин и пауза — одно компактное окно по центру затемнённого поля. */
.shop-modal, #pause-modal.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center; z-index: 2600; padding: 8px; }
.shop-modal.open, #pause-modal.modal.open { display: flex; }
.sheet {
  width: min(70vw, calc((100dvh - var(--ui-top) - var(--ui-bottom) - 20px) / 2.35));
  aspect-ratio: 1 / 2.35;
  max-height: calc(100dvh - var(--ui-top) - var(--ui-bottom) - 12px);
  background: #e7f2c4;
  border: 3px solid #3d4e28;
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.sheet-bar { flex: 0 0 auto; background: #6f8b46; color: #fff6c4; min-height: 38px; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 900; letter-spacing: 0.08em; font-size: 16px; text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
.sheet-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 48px; height: 32px; border-radius: 8px; border: 2px solid #3a2a10; background: #ffd24a; color: #2b1a0e; font-size: 22px; font-weight: 900; line-height: 1; cursor: pointer; padding: 0; }
/* Магазинчик и пауза — одна и та же рамка: ширина ≈ половина экрана, пропорция 570×1438, верх сразу под рядом кнопок HUD. */
.shop-window, .pause-window {
  --buttons-bottom: calc(max(var(--ui-top), 100cqw * 137 / 877) + 100cqw * 470 / 2400);
  --panel-top: calc(var(--buttons-bottom) + 8px);
  --bottom-panel-top: calc(100dvh - var(--ui-bottom) - 100cqw * 768 / 2544);
  --panel-room: calc(var(--bottom-panel-top) - var(--panel-top) - 10px);
  position: absolute;
  left: 50%;
  top: var(--panel-top);
  transform: translateX(-50%);
  width: min(50vw, calc(var(--panel-room) * 570 / 1438));
  aspect-ratio: 570 / 1438;
}
.shop-window {
  background: #d7d8ae url('img/shop_bg.png') center / 100% 100% no-repeat;
  border-radius: calc(50vw * 20 / 570);
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  overflow: hidden;
}
.shop-hitbox { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; border-radius: 16px; }
.shop-hitbox:active { background: rgba(255,255,255,0.18); }
.shop-hitbox[aria-disabled="true"] { cursor: default; }
.shop-hitbox[aria-disabled="true"]:active { background: transparent; }
.slot-1 { top: 8.97%; left: 7.19%; width: 38.42%; height: 15.37%; }
.slot-2 { top: 8.97%; left: 55.09%; width: 37.89%; height: 15.37%; }
.slot-3 { top: 27.05%; left: 7.19%; width: 38.42%; height: 15.37%; }
.slot-4 { top: 27.05%; left: 55.09%; width: 37.89%; height: 15.37%; }
.slot-5 { top: 45.13%; left: 7.19%; width: 38.42%; height: 15.44%; }
.slot-6 { top: 45.13%; left: 55.09%; width: 37.89%; height: 15.44%; }
.slot-7 { top: 63.28%; left: 7.19%; width: 38.42%; height: 15.58%; }
.slot-8 { top: 63.28%; left: 55.09%; width: 37.89%; height: 15.58%; }
.slot-9 { top: 81.64%; left: 7.19%; width: 38.42%; height: 15.65%; }
.slot-10 { top: 81.64%; left: 55.09%; width: 37.89%; height: 15.65%; }
.slot-close { top: 1.53%; left: 84.21%; width: 12.81%; height: 4.87%; border-radius: 10px; }
.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; }
/* Пауза растянута до размера магазина. Верх (шапка и кнопки) и низ (f / лайк / звезда) не искажаются, тянется только оливковая середина. */
.pause-window {
  display: flex;
  flex-direction: column;
  border-radius: 2.2% / 1.2%;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  overflow: hidden;
  background: #c5c6a0;
}
.pause-top, .pause-mid, .pause-bot { position: relative; width: 100%; background-repeat: no-repeat; }
.pause-top { flex: 0 0 auto; height: calc(100% * 430 / 902 * 570 / 1438); background-image: url('img/pause_top.png?v=47'); background-size: 100% 100%; }
.pause-bot { flex: 0 0 auto; height: calc(100% * 390 / 902 * 570 / 1438); background-image: url('img/pause_bot.png?v=47'); background-size: 100% 100%; }
.pause-mid { flex: 1 1 auto; min-height: 0; background-image: url('img/pause_mid.png?v=47'); background-size: 100% 100%; }
.pause-undo { left: 6.76%; top: 47.22%; width: 18.74%; height: 42.79%; }
.pause-list { left: 29.82%; top: 47.22%; width: 18.74%; height: 42.79%; }
.pause-restart { left: 52.66%; top: 47.22%; width: 18.63%; height: 42.79%; }
.pause-play { left: 75.50%; top: 47.22%; width: 18.40%; height: 42.79%; }
.pause-fb { left: 9.76%; top: 7.45%; width: 21.06%; height: 72.29%; }
.pause-like { left: 39.25%; top: 7.45%; width: 21.06%; height: 72.53%; }
.pause-star { left: 68.07%; top: 7.45%; width: 20.95%; height: 72.04%; }
.pause-missions {
  position: absolute;
  left: 4%;
  width: 92%;
  top: 3%;
  bottom: 3%;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 2%;
  pointer-events: none;
}
.pause-missions img { width: 100%; min-height: 0; flex: 1 1 0; object-fit: contain; object-position: center; display: block; }

/* ПОЧТА */
.mail-card { width: 100%; cursor: pointer; position: relative; margin-bottom: 8px;}
.mail-card img { width: 100%; display: block; border-radius: 8px; }
.mail-claim-btn { position: absolute; right: 1%; top: 2%; width: 20%; height: 96%; cursor: pointer; border-radius: 8px; }
.mail-claim-btn:active { background: rgba(255,255,255,0.3); }

/* МЕМЫ */
.meme-popup { position: fixed; bottom: 0; right: 0; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5000; pointer-events: none; }
.meme-popup.show { transform: translateX(0); pointer-events: auto; }
.meme-popup.show::before { content: ''; position: fixed; inset: 0; }
.meme-popup img { position: relative; max-height: 60vh; max-width: 90vw; display: block; object-fit: contain; object-position: bottom right; }
.meme-popup.discovery { left: 0; right: 0; width: 100%; display: flex; justify-content: center; }
.meme-popup.discovery img { width: min(100vw, 520px); max-width: 100vw; max-height: 78vh; object-position: center bottom; }

/* КНИГА */
.book-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
.book-tab { flex: 1; padding: 8px; background: #4a2c14; border: 1px solid #8b6f2e; border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; color: #fff;}
.book-tab.active { background: #ffd700; color: #000; border-color: #fff; }
.book-scroll { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; padding-right: 5px; }
.book-card { background: #4a2c14; border: 2px solid #8b6f2e; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; }
.book-card.locked { opacity: 0.5; filter: grayscale(1); }
.book-icon { width: 40px; height: 40px; background: #2b1a0e; border-radius: 6px; display: flex; justify-content: center; align-items: center; margin-bottom: 4px; }
.book-icon img { max-width: 90%; max-height: 90%; object-fit: contain; }
.book-icon span { font-size: 20px; }
.book-desc { font-size: 9px; line-height: 1.1; color: #ccc; margin-bottom: 6px; }

.discovery-popup { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(100px); background: #ffd700; border: 3px solid #8b6f2e; border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; z-index: 3000; opacity: 0; transition: all 0.4s ease; box-shadow: 0 5px 20px rgba(0,0,0,0.6); max-width: 90%; pointer-events: none; }
.discovery-popup.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.disc-img { width: 40px; height: 40px; background: #fff; border-radius: 8px; border: 2px solid #8b6f2e; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
.disc-img img { max-width: 90%; max-height: 90%; object-fit: contain; }

.float-text { position: fixed; pointer-events: none; font-size: 15px; font-weight: 900; color: #ffe98a; text-shadow: 0 2px 0 #5a3b00, 0 0 6px rgba(0,0,0,0.45); z-index: 500; display: flex; align-items: center; gap: 2px; animation: coinPop 1.9s cubic-bezier(.2,.8,.2,1) forwards; }

@keyframes coinPop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.25); } 16% { opacity: 1; transform: translate(-50%, -12px) scale(1.18); } 32% { opacity: 1; transform: translate(-50%, -2px) scale(1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--float-dx, 0px)), var(--float-dy, -72px)) scale(0.92); } }

/* АНИМАЦИЯ СЛИЯНИЯ */
.merging { transition: transform 0.2s ease-in, opacity 0.2s; z-index: 100; }

/* Пионер: прямой ход между центрами клеток и одно покачивание вокруг ступней.
   Сдвиг — ease-in-out, поворот — один синус (влево, затем вправо). Тайминг линейный, кривые запечены в кадры. */
@keyframes pieceWalk {
0% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 1), calc(var(--dy) * 1)) rotate(0deg); }
5% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9952), calc(var(--dy) * 0.9952)) rotate(-3.71deg); }
10% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9803), calc(var(--dy) * 0.9803)) rotate(-7.05deg); }
15% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9548), calc(var(--dy) * 0.9548)) rotate(-9.71deg); }
20% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9183), calc(var(--dy) * 0.9183)) rotate(-11.41deg); }
25% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.8708), calc(var(--dy) * 0.8708)) rotate(-12deg); }
30% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.8126), calc(var(--dy) * 0.8126)) rotate(-11.41deg); }
35% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.7445), calc(var(--dy) * 0.7445)) rotate(-9.71deg); }
40% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.6681), calc(var(--dy) * 0.6681)) rotate(-7.05deg); }
45% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.5857), calc(var(--dy) * 0.5857)) rotate(-3.71deg); }
50% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5)) rotate(0deg); }
55% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.4143), calc(var(--dy) * 0.4143)) rotate(3.71deg); }
60% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.3319), calc(var(--dy) * 0.3319)) rotate(7.05deg); }
65% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.2555), calc(var(--dy) * 0.2555)) rotate(9.71deg); }
70% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.1874), calc(var(--dy) * 0.1874)) rotate(11.41deg); }
75% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.1292), calc(var(--dy) * 0.1292)) rotate(12deg); }
80% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0817), calc(var(--dy) * 0.0817)) rotate(11.41deg); }
85% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0452), calc(var(--dy) * 0.0452)) rotate(9.71deg); }
90% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0197), calc(var(--dy) * 0.0197)) rotate(7.05deg); }
95% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0048), calc(var(--dy) * 0.0048)) rotate(3.71deg); }
100% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0), calc(var(--dy) * 0)) rotate(0deg); }
}
.cell.anim-walk { z-index: 8; }
.cell.anim-walk > .piece {
transform-origin: var(--walk-ox, 50%) var(--walk-oy, 80%);
animation: pieceWalk 0.56s linear both;
will-change: transform;
}
@keyframes omonHop {
0% { transform: translate(-50%, -50%) translateY(4px) scale(0.9); opacity: 0.45; }
32% { transform: translate(-50%, -50%) translateY(-8px) scale(1.04); opacity: 1; }
58% { transform: translate(-50%, -50%) translateY(-7px) scale(1.02); opacity: 1; }
100% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
}
.cell.anim-hop > .piece { animation: omonHop 0.75s cubic-bezier(0.45, 0.05, 0.55, 0.95) both; will-change: transform; }
@keyframes pieceShake {
0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
18% { transform: translate(-50%, -50%) rotate(-10deg); }
36% { transform: translate(-50%, -50%) rotate(9deg); }
54% { transform: translate(-50%, -50%) rotate(-7deg); }
72% { transform: translate(-50%, -50%) rotate(5deg); }
}
.cell.anim-shake > .piece { animation: pieceShake 0.4s ease-in-out; transform-origin: 50% 80%; }
@keyframes targetPulse {
0%, 100% { box-shadow: inset 0 0 0 3px rgba(255, 215, 0, 0.35); }
50% { box-shadow: inset 0 0 0 4px #ffe566, 0 0 12px rgba(255, 214, 80, 0.85); }
}
.cell.tut-target { background: rgba(255, 214, 80, 0.38); animation: targetPulse 1s ease-in-out infinite; z-index: 5; }
#next-tile.tut-source { outline: 3px solid #ffe566; outline-offset: -8px; border-radius: 12px; }

#hint-recipe {
position: absolute;
left: 5%;
right: 8%;
top: 16%;
bottom: 14%;
display: none;
align-items: center;
justify-content: center;
flex-wrap: nowrap;
gap: 1px 2px;
pointer-events: none;
padding: 4px 2px;
}
#hint-recipe.has-recipe {
display: flex;
background: #62844a;
border-radius: 14px;
box-shadow: inset 0 0 0 2px rgba(35, 55, 24, 0.45);
}
.hint-ico { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
#hint-recipe.compact .hint-ico { width: 18px; height: 18px; }
#hint-recipe.compact .hint-arrow, #hint-recipe.compact .hint-x { font-size: 11px; }
.hint-emoji { font-size: 16px; line-height: 1; }
.hint-arrow, .hint-x { color: #17210f; font-weight: 900; font-size: 13px; line-height: 1; flex: 0 0 auto; }
.hint-empty {
width: 16px; height: 16px; border: 2px dashed #17210f; border-radius: 4px; flex: 0 0 auto;
}

#tutorial {
position: absolute; top: env(safe-area-inset-top); right: 0; bottom: env(safe-area-inset-bottom); left: 0; z-index: 1900; display: none; pointer-events: none;
}
#tutorial.on { display: block; }
.tut-bubble {
pointer-events: auto;
position: absolute;
left: 4%;
width: 64%;
top: 18%;
background: #fff8e8;
color: #2b1a0e;
border: 3px solid #4a2c14;
border-radius: 16px;
padding: 14px 14px 10px;
box-shadow: 0 10px 28px rgba(0,0,0,0.4);
font-size: 15px;
line-height: 1.35;
font-weight: 700;
}
.tut-bubble.tut-low { top: auto; bottom: 31%; }
.tut-bubble:after {
content: '';
position: absolute;
left: 28px;
bottom: -12px;
border-width: 12px 10px 0 10px;
border-style: solid;
border-color: #4a2c14 transparent transparent transparent;
}
.tut-actions { display: flex; gap: 8px; margin-top: 10px; }
.tut-actions button {
flex: 1;
padding: 9px 8px;
border-radius: 10px;
font-weight: 900;
font-size: 14px;
border: 2px solid #4a2c14;
cursor: pointer;
}
#tut-next { background: #ffd700; color: #2b1a0e; }
#tut-skip { background: #fff; color: #6b5344; }
#tut-finger {
position: fixed; left: 0; top: 0; z-index: 1950; width: 46px; height: 60px;
pointer-events: none; display: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.45));
}
#tut-arrow {
position: absolute; z-index: 1960; display: none; pointer-events: none;
font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 0 #2b1a0e);
animation: arrowBounce 0.7s ease-in-out infinite;
}
@keyframes arrowBounce {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-8px); }
}
.pause-extra {
width: 100%;
padding: 10px 8px;
margin-bottom: 8px;
border-radius: 10px;
border: 2px solid #3e4a28;
background: #ffe08a;
color: #2b1a0e;
font-weight: 900;
font-size: 15px;
cursor: pointer;
}
.pause-extra.alt { background: #f4f0d8; }
#title-screen { position: fixed; inset: 0; z-index: 2400; background: #1a140c url('img/title_bg.jpg') center / cover no-repeat; }
#title-screen.hidden { display: none; }
#title-wordmark { position: absolute; left: 3%; width: 94%; height: auto; top: calc(var(--ui-top) + 8px); object-fit: contain; object-position: center top; pointer-events: none; z-index: 2; }
#title-play { position: absolute; border: 0; background: transparent; padding: 0; cursor: pointer; z-index: 2; }
#title-play img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.title-hot { position: absolute; border: 0; background: transparent; padding: 0; cursor: pointer; z-index: 3; }
.title-hot .sfx-slash { display: none; position: absolute; left: 16%; right: 16%; top: 46%; height: 8%; min-height: 4px; background: #e02323; border-radius: 4px; transform: rotate(-38deg); box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
#title-sfx.off .sfx-slash { display: block; }
.saw-swipe { position: fixed; z-index: 2200; pointer-events: none; object-fit: contain; animation: sawSwipe 1s linear forwards; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
@keyframes sawSwipe {
0% { transform: translate(18%, -8%) rotate(-48deg); }
24% { transform: translate(46%, 34%) rotate(-24deg); }
50% { transform: translate(12%, -12%) rotate(-50deg); }
74% { transform: translate(48%, 36%) rotate(-22deg); }
100% { transform: translate(20%, 8%) rotate(-36deg); opacity: 0; }
}
#hint-gallery { position: fixed; inset: 0; z-index: 5200; display: none; background: #14200e; touch-action: none; }
#hint-gallery.open { display: block; }
#hint-track { height: 100%; display: flex; width: 300%; transition: transform 0.28s ease; will-change: transform; }
#hint-track.dragging { transition: none; }
#hint-track img { width: 33.333%; height: 100%; object-fit: cover; object-position: center; flex: 0 0 33.333%; background: #14200e; pointer-events: none; user-select: none; }
#hint-close { position: absolute; top: calc(var(--ui-top) + 8px); right: calc(var(--ui-right) + 8px); width: 48px; height: 48px; border-radius: 12px; border: 3px solid #3a2a10; background: #ffd24a; color: #2b1a0e; font-size: 30px; font-weight: 900; line-height: 1; cursor: pointer; z-index: 2; padding: 0; }
.hint-dots { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; z-index: 2; pointer-events: auto; }
.hint-dot { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.45); cursor: pointer; }
.hint-dot.on { background: #ffd24a; }
#start-choice { z-index: 4700; }
#confirm-modal { z-index: 4800; }
.confirm-actions { display: flex; gap: 8px; }
.confirm-actions button, .choice-btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 16px; border: none; cursor: pointer; }
.choice-btn { width: 100%; margin-top: 8px; background: #ffd700; color: #2b1a0e; }
.choice-btn.alt { background: #f4f0d8; }
#confirm-yes { background: #ffd700; color: #2b1a0e; }
#confirm-no { background: #8b3a3a; color: #fff; }
#confirm-text { text-align: center; font-weight: 800; font-size: 18px; line-height: 1.35; margin-bottom: 14px; }
.gameover-card { align-items: stretch; }
.gameover-card h2 { font-size: 20px; margin-bottom: 4px; }
.go-btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 3px solid #3a2a10;
  background: #ffd24a;
  color: #2b1a0e;
  font-weight: 900;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.go-btn .go-price { font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.go-btn .go-price img { width: 18px; height: 18px; object-fit: contain; }
.go-btn.is-off, .go-btn:disabled {
  background: #9a9a9a;
  color: #f2f2f2;
  border-color: #6a6a6a;
  cursor: default;
}
.go-stars { background: #8fce57; }
.go-restart {
  margin-top: 14px;
  background: none;
  border: none;
  color: #ffe7a3;
  font-size: 14px;
  font-weight: 700;
  text-decoration: underline;
  cursor: pointer;
  align-self: center;
}
#toast {
  position: fixed;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  background: rgba(28, 20, 10, 0.94);
  color: #fff;
  border: 2px solid #ffd24a;
  border-radius: 12px;
  padding: 10px 18px;
  font-weight: 900;
  font-size: 16px;
  z-index: 6100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
.cell.anim-walk > .piece,
.cell.anim-hop > .piece,
.cell.anim-shake > .piece,
.piece.piece-pop, .piece.land-bounce, .merge-glow, .score-float,
.cell.tut-target, #tut-arrow, .float-text, .saw-swipe, .hit-jurist img.sway { animation: none !important; }
.shade, #boot { transition: none !important; }
}
</style>
</head>

function paintHud() {

function hudDigitEm() {
const probe = document.getElementById('score-num');
if (!probe) return 0.62;
const cs = getComputedStyle(probe);
const s = document.createElement('span');
s.textContent = '000000000';
s.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;font-weight:' + cs.fontWeight + ';font-family:' + cs.fontFamily + ';font-size:100px;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;';
document.body.appendChild(s);
const w = s.getBoundingClientRect().width;
s.remove();
return w > 0 ? w / 9 / 100 : 0.62;
}
function layoutHudDigits() {
const boxes = ['score-box', 'coins-box', 'moves-box'].map(id => document.getElementById(id));
if (boxes.some(b => !b || !b.clientWidth)) return;
const em = hudDigitEm();
const scoreBox = boxes[0], coinsBox = boxes[1];
const byScore = (scoreBox.clientWidth - 2) / (9 * em);
const byCoins = (coinsBox.clientWidth - 2) / (8 * em);
const byH = scoreBox.clientHeight * 0.92;
let size = Math.max(8, Math.min(byScore, byCoins, byH));
boxes.forEach(box => { box.querySelector('.num-container').style.fontSize = size + 'px'; });
let scale = 1;
boxes.forEach(box => {
const nums = box.querySelector('.num-container');
if (nums.scrollWidth > box.clientWidth + 0.5) scale = Math.min(scale, box.clientWidth / nums.scrollWidth);
});
if (scale < 0.999) {
const shrunk = Math.max(6, size * scale);
boxes.forEach(box => { box.querySelector('.num-container').style.fontSize = shrunk + 'px'; });
}
}
function syncHud() {

if (movesEl) movesEl.textContent = String(moves);

hudReady = true;
hudView.score = score;
hudView.coins = coins;
hudGoal.score = score;
hudGoal.coins = coins;
hudAnimToken++;
paintHud();
layoutHudDigits();
return;
}
if (hudGoal.score === score && hudGoal.coins === coins) {
paintHud();
layoutHudDigits();
return;
}
const fromS = hudView.score, fromC = hudView.coins;
const toS = score, toC = coins;
hudGoal.score = toS;
hudGoal.coins = toC;
const t0 = performance.now();
const token = ++hudAnimToken;
function frame(now) {
if (token !== hudAnimToken) return;
const t = Math.min(1, (now - t0) / 350);
hudView.score = Math.round(fromS + (toS - fromS) * t);
hudView.coins = Math.round(fromC + (toC - fromC) * t);
paintHud();
layoutHudDigits();
if (t < 1) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
layoutHudDigits();
}

function getTileImage(tile) {

function tileEmoji(tile) {

if (tile.kind === 'tool') return '🛠️';

}

function setStatus() {}

const ROCKET_NOSE = 15, ROCKET_BODY = 16, ROCKET_TAIL = 17, ROCKET_FULL = 18, GAGARIN = 14;
/* Mating edges from the sprite alpha, not the full bounding box (the nose is tilted, and the
   body's wire loop / the tail's nozzle lip stick out past the tube). x is the edge column,
   top/bot the vertical span of that face. The tail x is the fuselage ring; the nozzle overlaps
   into the body. */
const ROCKET_EDGE = {
nose: { natW: 1520, natH: 1296, x: 1116, top: 296, bot: 991 },
body: { natW: 1520, natH: 1296, x: 222, top: 311, bot: 954, rx: 1311, rTop: 409, rBot: 860 },
tail: { natW: 1552, natH: 1280, x: 436, top: 375, bot: 888 }
};
const ROCKET_OVERLAP = 6;
/* Extra tuck so the tail's ring meets the body's tapered cap, not just the nozzle lip. */
const ROCKET_TAIL_TUCK = 8;
const TRIM = {};
let trimsPending = 0;

function measureTrim(img) {
const w = img.naturalWidth, h = img.naturalHeight;
if (!w || !h) return { l: 0, t: 0, r: 1, b: 1, natW: w || 1, natH: h || 1 };
const max = 180;
const s = Math.min(1, max / Math.max(w, h));
const c = document.createElement('canvas');
c.width = Math.max(1, Math.round(w * s));
c.height = Math.max(1, Math.round(h * s));
const ctx = c.getContext('2d', { willReadFrequently: true });
ctx.drawImage(img, 0, 0, c.width, c.height);
let data;
try { data = ctx.getImageData(0, 0, c.width, c.height).data; }
catch (e) { return { l: 0, t: 0, r: 1, b: 1, natW: w, natH: h }; }
let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
for (let y = 0; y < c.height; y++) {
for (let x = 0; x < c.width; x++) {
if (data[(y * c.width + x) * 4 + 3] > 16) {
if (x < minX) minX = x;
if (y < minY) minY = y;
if (x > maxX) maxX = x;
if (y > maxY) maxY = y;
}
}
}
if (maxX < 0) return { l: 0, t: 0, r: 1, b: 1, natW: w, natH: h };
return { l: minX / c.width, t: minY / c.height, r: (maxX + 1) / c.width, b: (maxY + 1) / c.height, natW: w, natH: h };
}

function indexTrims() {
const srcs = new Set();
for (let i = 1; i <= 28; i++) srcs.add('img/pasha_' + (i < 10 ? '0' + i : i) + '.png');
for (let i = 1; i <= 20; i++) srcs.add('img/bear_' + i + '.png');
for (let i = 1; i <= 5; i++) srcs.add('img/income_' + i + '.png');
['img/omon_1.png','img/omon_2.png','img/Pioner_1.png','img/tool_saw.png','img/tool_sack.png','img/tool_jurist.png','img/tool_jurist_bound.png','img/tool_nanobox.png'].forEach(s => srcs.add(s));
trimsPending = srcs.size;
srcs.forEach(src => {
const img = new Image();
img.onload = () => { TRIM[src] = measureTrim(img); if (--trimsPending === 0) onTrimsReady(); };
img.onerror = () => { if (--trimsPending === 0) onTrimsReady(); };
img.src = src;
});
}

function cellSize() {
const board = document.getElementById('board');
const w = board && board.clientWidth ? board.clientWidth / SIZE : 64;
const h = board && board.clientHeight ? board.clientHeight / SIZE : w;

}

function pieceDisplaySize(src, cellW, cellH) {
const limit = 0.92 * Math.min(cellW, cellH);
const trim = src && TRIM[src];
if (!trim) return { w: limit, h: limit };
const cW = Math.max(1, (trim.r - trim.l) * trim.natW);
const cH = Math.max(1, (trim.b - trim.t) * trim.natH);
const s = limit / Math.max(cW, cH);
return { w: trim.natW * s, h: trim.natH * s };
}

function makeTileContent(tile) {
const wrap = document.createElement('span');
wrap.className = 'piece';
const src = getTileImage(tile);
const cs = cellSize();
if (src) {
const img = document.createElement('img');
img.src = src;
img.alt = '';
img.draggable = false;
const size = pieceDisplaySize(src, cs.w, cs.h);
wrap.style.width = size.w + 'px';
wrap.style.height = size.h + 'px';
img.onerror = function() {
wrap.classList.add('piece-emoji');
wrap.style.width = (cs.w * 0.92) + 'px';
wrap.style.height = (cs.h * 0.92) + 'px';
wrap.textContent = tileEmoji(tile);
};
wrap.appendChild(img);
} else {
wrap.classList.add('piece-emoji');
wrap.style.width = (cs.w * 0.92) + 'px';
wrap.style.height = (cs.h * 0.92) + 'px';
wrap.textContent = tileEmoji(tile);
}
applyPieceScale(wrap, src);
return wrap;
}

function applyPieceScale(wrap, src) {
const tweak = src && PIECE_LAYOUT[src];
if (!tweak || !tweak.scale || tweak.scale === 1) return;
wrap.style.width = (parseFloat(wrap.style.width) * tweak.scale) + 'px';
wrap.style.height = (parseFloat(wrap.style.height) * tweak.scale) + 'px';
}

function seatPiece(wrap, src, cell) {
const tweak = src && PIECE_LAYOUT[src];
if (!tweak || !cell) return;
if (tweak.z) cell.style.zIndex = String(tweak.z);
const cellH = cell.clientHeight || cellSize().h;
const cellW = cell.clientWidth || cellSize().w;
let dy = 0;
let moved = false;
if (tweak.floor) {
const trim = TRIM[src];
const b = trim ? trim.b : 1;
const h = parseFloat(wrap.style.height) || 0;
if (h && cellH) {
const pad = Math.min(cellW, cellH) * 0.04;
const currentBottom = (cellH - h) / 2 + b * h;
dy = (cellH - pad) - currentBottom;
moved = true;
}
}
if (tweak.drop) { dy += tweak.drop * cellH; moved = true; }
if (tweak.lift) { dy -= tweak.lift * cellH; moved = true; }
if (moved) wrap.style.setProperty('--piece-dy', dy.toFixed(2) + 'px');
}

function layoutJurist() {
const box = document.querySelector('.hit-jurist');
const img = document.getElementById('jurist-img');
const ring = document.getElementById('jurist-ring');
if (!box || !img) return;
const cs = cellSize();
const src = (img.getAttribute('src') || '').split('?')[0];
const disp = pieceDisplaySize(src, cs.w, cs.h);
img.style.width = disp.w + 'px';
img.style.height = disp.h + 'px';
const trim = TRIM[src] || { l: 0, t: 0, r: 1, b: 1 };
img.style.setProperty('--sway-ox', (((trim.l + trim.r) / 2) * 100).toFixed(2) + '%');
img.style.setProperty('--sway-oy', (trim.b * 100).toFixed(2) + '%');
if (!ring) return;
const visW = Math.max(8, (trim.r - trim.l) * disp.w);
const visH = Math.max(8, (trim.b - trim.t) * disp.h);
const d = Math.max(visW * 1.62, visH * 0.78);
ring.style.width = d + 'px';
ring.style.height = d + 'px';
const cx = ((trim.l + trim.r) / 2 - 0.5) * disp.w;
const visTop = -disp.h / 2 + trim.t * disp.h;
const cy = visTop + Math.min(visH * 0.34, visH - d / 2 - visH * 0.08);
ring.style.transform = 'translate(calc(-50% + ' + cx.toFixed(1) + 'px), calc(-50% + ' + cy.toFixed(1) + 'px))';
}

if (!tile) return;

if (trapped.length) notifyTutorial({ type: 'trap', n: trapped.length });
render();
function next() {
if (!spots.length) { saveGame(); checkGameOver(); return; }
const [r, c] = spots.shift();
if (!grid[r] || !grid[r][c]) { next(); return; }
processCascades(r, c, false, next);
}
next();
}

function omonJumpTargets(r, c, level) {
let empty = [];
for (let r2 = 0; r2 < SIZE; r2++) for (let c2 = 0; c2 < SIZE; c2++) {
if (grid[r2][c2]) continue;
let dist = Math.max(Math.abs(r2 - r), Math.abs(c2 - c));
if (dist === 0) continue;
empty.push({ r: r2, c: c2, dist });
}
if (!empty.length) return empty;
if (level >= 2) {
let far = empty.filter(e => e.dist >= 3);
if (far.length) return far;
} else {
let mid = empty.filter(e => e.dist >= 2 && e.dist <= 3);
if (mid.length) return mid;
}
return empty;
}

function stepOmons(omons) {
let taken = {};
omons.forEach(([r, c]) => {
if (!grid[r][c] || grid[r][c].kind !== 'omon') return;
let level = grid[r][c].level || 1;
let pool = omonJumpTargets(r, c, level).filter(p => !taken[p.r + ',' + p.c]);
if (!pool.length) return;
let p = pool[Math.floor(Math.random() * pool.length)];
taken[p.r + ',' + p.c] = true;
let tile = grid[r][c];
grid[r][c] = null;
grid[p.r][p.c] = tile;
moveAnims.push({ r: p.r, c: p.c, fromR: r, fromC: c, hop: true });
});
}

function finishUnits() {
stepPioneers();
if (!tutorial.active && moves % 50 === 0) nextTile = { kind: 'omon', level: Math.random() < 0.5 ? 1 : 2, pop: true };
const trapped = trappedPioneers();
render();
if (document.querySelector('.cell.anim-hop')) markBusy(860);
else if (document.querySelector('.cell.anim-walk')) markBusy(660);
if (trapped.length) {
sfx('trap');
trapped.forEach(([r, c]) => {
const cell = document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
if (cell) cell.classList.add('anim-shake');
});
markBusy(1100);
setTimeout(() => convertTrapped(trapped), 420);
} else {
saveGame();
checkGameOver();
}
}

function endMove() {
moves++;
if (juristCooldown > 0) {
juristCooldown--;
if (juristCooldown === 0) onJuristReady();
}
sawStreak = 0;

for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {

let gain = INCOME_PER_TURN[grid[r][c].level - 1] || 5;
coins += gain;
showFloatText(r, c, gain);
}
}

let omons = [];
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
if (grid[r][c] && grid[r][c].kind === 'omon') {
if (grid[r][c].skipMove) delete grid[r][c].skipMove;
else omons.push([r, c]);
}
}

if (omons.length > 0) {
markBusy(1100);
setTimeout(() => {
stepOmons(omons);
finishUnits();
}, 200);
} else {
finishUnits();
}
}

function placeGhost(clientX, clientY) {

function startTrayDrag(e, type, tile) {

try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch(_) {}

function onUp(e) {

if (jailTile.kind === 'tool') {
// Применение инструмента из тюрьмы

jailTile = null;

if (tool.tool === 'jurist') {

let taken = grid[r][c]; grid[r][c] = null;
nextTile = taken;
sfx('pop');
endMove();
} else { render(); }
}
else if (tool.tool === 'saw') {
if (grid[r][c]) {
playSawFx(r, c);
grantSawCash(grid[r][c], r, c);
if (grid[r][c].kind === 'omon' || grid[r][c].kind === 'pioneer') {

} else {
grid[r][c] = null;
}

} else { sfx('weed'); render(); }
}
else if (tool.tool === 'nanobox') {
if (grid[r][c]) playNanobox(r, c, true);
else render();
}
else if (tool.tool === 'sack') {
if (!grid[r][c]) {
let neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]], tryKinds = [];
for (let i = 0; i < neighbors.length; i++) {
let nr = neighbors[i][0], nc = neighbors[i][1];
if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
let nt = grid[nr][nc];
if (!nt || nt.kind === 'omon' || nt.kind === 'pioneer' || nt.kind === 'tool') continue;
let found = false;
for (let k = 0; k < tryKinds.length; k++) if (tryKinds[k].kind === nt.kind && tryKinds[k].level === nt.level) { found = true; break; }
if (!found) tryKinds.push({ kind: nt.kind, level: nt.level });
}
tryKinds.sort((a, b) => {
if (a.kind === 'income' && b.kind !== 'income') return -1;
if (b.kind === 'income' && a.kind !== 'income') return 1;
return b.level - a.level;
});
let merged = false;
for (let j = 0; j < tryKinds.length; j++) {
let tk = tryKinds[j]; grid[r][c] = { kind: tk.kind, level: tk.level };
let grp = findGroup(r, c);
let maxL = tk.kind === 'chain' ? CHAIN.length : (tk.kind === 'care' ? CARE.length : INCOME.length);
if (grp && grp.length >= 3 && tk.level < maxL && groupCanMerge(grp, grid[r][c])) { merged = true; break; }
grid[r][c] = null;
}
if (!merged) grid[r][c] = { kind: 'income', level: 1 };
render();
processCascades(r, c, false, () => endMove());
} else { render(); }
}
return;
} else {
// Обычная фишка из тюрьмы
if (!grid[r][c]) {
undoState = takeSnapshot();
grid[r][c] = jailTile;
jailTile = null;
noteBoardMoney(grid[r][c]);
checkDiscovery(grid[r][c]);
if (grid[r][c].kind === 'omon') grid[r][c].skipMove = true;
render();
processCascades(r, c, false, () => endMove());
}
}
}
drag = null;
return;
}

// В ТЮРЬМУ
if (el && el.closest('#jail')) {
if (drag.type === 'fromNext') {
if (jailTile) bufferedNext = jailTile;
jailTile = nextTile;
nextTile = bufferedNext || dealNext();
bufferedNext = null;
render(); saveGame();
sfx('place');
notifyTutorial({ type: 'jail' });
drag = null;
return;
}
}

// НА ПОЛЕ ИЗ ДАЛЕЕ
if (cell) {
const r = +cell.dataset.r, c = +cell.dataset.c;

if (nextTile && nextTile.kind === 'tool') {
if (nextTile.tool !== 'sack' && !grid[r][c]) {
setStatus();
if (nextTile.tool === 'saw') sfx('weed');
drag = null;
return;
}

undoState = takeSnapshot();

if (nextTile.tool === 'jurist') {
nextTile = grid[r][c]; grid[r][c] = null;
sfx('pop');
render(); saveGame();
notifyTutorial({ type: 'jurist' });
drag = null;
return;
}
else if (nextTile.tool === 'saw') {
playSawFx(r, c);
grantSawCash(grid[r][c], r, c);
if (grid[r][c].kind === 'omon' || grid[r][c].kind === 'pioneer') {
grid[r][c] = { kind: 'care', level: 1 }; checkDiscovery(grid[r][c]);
} else {
grid[r][c] = null;
}
nextTile = bufferedNext || dealNext();
bufferedNext = null;
sawStreak++;
if (sawStreak >= 2 && missions.saw.status === 'active') {
missions.saw.status = 'completed';
updateMailBadge();
}
render();
processCascades(r, c, false, () => saveGame());
drag = null;
return;
}
else if (nextTile.tool === 'nanobox') {
playNanobox(r, c, false);
drag = null;
return;
}
else if (nextTile.tool === 'sack') {
if (grid[r][c]) {
setStatus();
drag = null; return;
}

let neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]], tryKinds = [];
for (let i = 0; i < neighbors.length; i++) {
let nr = neighbors[i][0], nc = neighbors[i][1];
if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
let nt = grid[nr][nc];
if (!nt || nt.kind === 'omon' || nt.kind === 'pioneer' || nt.kind === 'tool') continue;
let found = false;
for (let k = 0; k < tryKinds.length; k++) if (tryKinds[k].kind === nt.kind && tryKinds[k].level === nt.level) { found = true; break; }
if (!found) tryKinds.push({ kind: nt.kind, level: nt.level });
}

tryKinds.sort((a, b) => {
if (a.kind === 'income' && b.kind !== 'income') return -1;
if (b.kind === 'income' && a.kind !== 'income') return 1;
return b.level - a.level;
});

let merged = false;
for (let j = 0; j < tryKinds.length; j++) {
let tk = tryKinds[j];
grid[r][c] = { kind: tk.kind, level: tk.level };
let grp = findGroup(r, c);
let maxL = tk.kind === 'chain' ? CHAIN.length : (tk.kind === 'care' ? CARE.length : INCOME.length);
if (grp && grp.length >= 3 && tk.level < maxL && groupCanMerge(grp, grid[r][c])) {
merged = true; break;
}
grid[r][c] = null;
}

if (!merged) grid[r][c] = { kind: 'income', level: 1 };

nextTile = bufferedNext || dealNext();
bufferedNext = null;
render();
sfx('place');
notifyTutorial({ type: 'sack' });
processCascades(r, c, false, () => endMove());
drag = null;
return;
}
render(); saveGame(); drag = null;
return;
}

if (!grid[r][c]) {
undoState = takeSnapshot();
grid[r][c] = nextTile;
noteBoardMoney(nextTile);
checkDiscovery(nextTile);
if (nextTile.kind === 'omon') grid[r][c].skipMove = true;

const sackPlace = nextTile.tool === 'sack';
nextTile = bufferedNext || dealNext();
bufferedNext = null;
render();
sfx('place');
notifyTutorial({ type: 'placed' });
processCascades(r, c, sackPlace, () => endMove());
}
}
drag = null;
}

let masterGain = null;
let audioGen = 0;
const audioLoopMakers = new Map();
const audioLoopNodes = new Map();

function audioBus(ctx) {
if (masterGain && ctx === audioCtx) return masterGain;
return ctx.destination;
}

function stopAudioLoops() {
audioLoopNodes.forEach(node => {
try { if (node.stop) node.stop(); } catch (e) {}
try { if (node.disconnect) node.disconnect(); } catch (e) {}
});
audioLoopNodes.clear();
}

function startAudioLoops(ctx) {
stopAudioLoops();
if (!ctx || !masterGain || sfxMuted) return;
audioLoopMakers.forEach((maker, name) => {
try {
const node = maker(ctx, masterGain);
if (node) audioLoopNodes.set(name, node);
} catch (e) {}
});
}

/* Единственная точка для фоновой петли: при пересоздании контекста старая петля
   гасится и стартует ровно одна новая, без наложения. */
function addAudioLoop(name, maker) {
audioLoopMakers.set(name, maker);
if (!audioCtx || audioCtx.state === 'closed' || sfxMuted || !masterGain) return;
const prev = audioLoopNodes.get(name);
if (prev) {
try { if (prev.stop) prev.stop(); } catch (e) {}
audioLoopNodes.delete(name);
}
try {
const node = maker(audioCtx, masterGain);
if (node) audioLoopNodes.set(name, node);
} catch (e) {}
}

function createAudio() {
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return null;
const gen = ++audioGen;
stopAudioLoops();
const prev = audioCtx;
audioCtx = null;
masterGain = null;
if (prev && prev.state !== 'closed') {
try { prev.close(); } catch (e) {}
}
let ctx;
try { ctx = new AC(); } catch (e) { return null; }
if (gen !== audioGen) {
try { ctx.close(); } catch (e) {}
return audioCtx;
}
const bus = ctx.createGain();
bus.gain.value = sfxMuted ? 0 : 1;
bus.connect(ctx.destination);
audioCtx = ctx;
masterGain = bus;
startAudioLoops(ctx);
return ctx;
}

function audioBroken(ctx) {
if (!ctx) return true;
const state = ctx.state;
return state === 'closed' || state === 'interrupted';
}

function ensureAudio() {
if (sfxMuted) return null;
if (audioBroken(audioCtx)) createAudio();
if (!audioCtx) return null;
if (audioCtx.state !== 'running') {
const pending = audioCtx;
try {
const p = pending.resume();
if (p && typeof p.then === 'function') {
p.then(function () {
if (audioCtx !== pending) return;
if (audioBroken(pending)) createAudio();
}).catch(function () {
if (audioCtx === pending) createAudio();
});
}
} catch (e) {
if (audioCtx === pending) createAudio();
}
}
return audioCtx && !audioBroken(audioCtx) ? audioCtx : null;
}

function resumeAudio() {
if (sfxMuted) return;
ensureAudio();
}

function suspendAudio() {
const ctx = audioCtx;
if (!ctx || ctx.state !== 'running') return;
try {
const p = ctx.suspend();
if (p && typeof p.catch === 'function') p.catch(function () {});
} catch (e) {}
}

function envTone(ctx, freq, t, dur, type, gain) {

const g = ctx.createGain();
o.type = type;
o.frequency.setValueAtTime(freq, t);
g.gain.setValueAtTime(gain, t);
g.gain.exponentialRampToValueAtTime(0.001, t + dur);
o.connect(g); g.connect(audioBus(ctx));
o.start(t); o.stop(t + dur + 0.02);
}

function sfx(name) {

if (!ctx) return;
const t = ctx.currentTime;
if (name === 'place') {
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(160, t);
o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
g.gain.setValueAtTime(0.28, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
o.connect(g); g.connect(audioBus(ctx));
o.start(t); o.stop(t + 0.15);
} else if (name === 'merge') {
envTone(ctx, 523, t, 0.12, 'sine', 0.16);
envTone(ctx, 659, t + 0.07, 0.14, 'sine', 0.14);
envTone(ctx, 784, t + 0.14, 0.18, 'triangle', 0.12);
} else if (name === 'step') {
envTone(ctx, 990, t, 0.035, 'square', 0.03);
} else if (name === 'ui') {
envTone(ctx, 740, t, 0.045, 'square', 0.04);
} else if (name === 'trap') {
marimbaNote(ctx, t, 698, 0.2, 0.2);
marimbaNote(ctx, t + 0.13, 466, 0.22, 0.18);
} else if (name === 'pop') {
corkPop(ctx, t);
} else if (name === 'saw') {
sawStroke(ctx, t);
sawStroke(ctx, t + 0.5);
sawDing(ctx, t + 1.02);
} else if (name === 'weed') {
weedStab(ctx, t);
weedStab(ctx, t + 0.09);

function juristApplause(ctx, t) {

noiseBurst(ctx, t + dt + 0.01, 0.03, 1200, 380, g * 0.4, 1.5);

function juristWow(ctx, t) {

osc.frequency.linearRampToValueAtTime(146, t + 0.5);

master.gain.setValueAtTime(0.0001, t);
master.gain.exponentialRampToValueAtTime(0.2, t + 0.05);
master.gain.setValueAtTime(0.16, t + 0.24);
master.gain.exponentialRampToValueAtTime(0.0001, t + 0.52);

f.frequency.linearRampToValueAtTime(spec[1], t + 0.42);

g.gain.value = spec[3];

function corkPop(ctx, t) {

function noiseBurst(ctx, t, dur, fromFreq, toFreq, gainVal, q) {
const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
const data = buf.getChannelData(0);
for (let i = 0; i < frames; i++) {
const p = i / frames;
data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * p);
}
const src = ctx.createBufferSource();
src.buffer = buf;
const f = ctx.createBiquadFilter();
f.type = 'bandpass';
f.Q.value = q || 3;
f.frequency.setValueAtTime(fromFreq, t);
f.frequency.exponentialRampToValueAtTime(Math.max(40, toFreq), t + dur);
const g = ctx.createGain();
g.gain.setValueAtTime(0.0001, t);
g.gain.linearRampToValueAtTime(gainVal, t + Math.min(0.025, dur * 0.15));
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
src.connect(f); f.connect(g); g.connect(audioBus(ctx));
src.start(t);
src.stop(t + dur + 0.02);
}

function sackResultAt(r, c) {

for (let i = 0; i < counts.length; i++) {

function previewResult(tile, r, c) {
if (!tile) return null;
const occ = grid[r][c];
if (tile.kind === 'tool' && tile.tool === 'nanobox') {
if (!occ || occ.kind === 'tool') return null;
return { ...occ };
}
if (tile.kind === 'tool' && tile.tool === 'saw') {
if (!occ) return null;
if (occ.kind === 'omon' || occ.kind === 'pioneer') return { kind: 'care', level: 1 };
return { empty: true };
}
if (tile.kind === 'tool' && tile.tool === 'jurist') {
if (!occ || occ.kind === 'omon') return null;
return { ...occ };
}
if (tile.kind === 'tool' && tile.tool === 'sack') {
if (occ) return null;
return sackResultAt(r, c);
}
if (occ) return null;
if (tile.kind === 'chain' && tile.level >= ROCKET_NOSE && tile.level <= ROCKET_TAIL) {
return wouldCompleteRocket(tile, r, c) ? { kind: 'chain', level: ROCKET_FULL } : null;
}
if (tile.kind !== 'chain' && tile.kind !== 'care' && tile.kind !== 'income') return null;
const prev = grid[r][c];
grid[r][c] = tile;
const g = findGroup(r, c);
grid[r][c] = prev;
if (!groupCanMerge(g, tile)) return null;
if (tile.kind === 'chain' && tile.level === GAGARIN) {

function giveClone(target) {

function launchClone(target, r, c, x0, y0) {

const dur = 600;
const arc = Math.max(72, Math.hypot(x1 - x0, y1 - y0) * 0.5);
const t0 = performance.now();
function frame(now) {
const t = Math.min(1, (now - t0) / dur);
const x = x0 + (x1 - x0) * t;
const y = y0 + (y1 - y0) * t - Math.sin(Math.PI * t) * arc;
