<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7e6829">
<title>Демократия — Финал</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --safe-top: max(var(--tg-safe-area-inset-top, 0px), env(safe-area-inset-top, 0px));
  --safe-right: max(var(--tg-safe-area-inset-right, 0px), env(safe-area-inset-right, 0px));
  --safe-bottom: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
  --safe-left: max(var(--tg-safe-area-inset-left, 0px), env(safe-area-inset-left, 0px));
  --content-top: var(--tg-content-safe-area-inset-top, 0px);
  --content-right: var(--tg-content-safe-area-inset-right, 0px);
  --content-bottom: var(--tg-content-safe-area-inset-bottom, 0px);
  --content-left: var(--tg-content-safe-area-inset-left, 0px);
  --inset-top: calc(var(--safe-top) + var(--content-top));
  --inset-right: calc(var(--safe-right) + var(--content-right));
  --inset-bottom: calc(var(--safe-bottom) + var(--content-bottom));
  --inset-left: calc(var(--safe-left) + var(--content-left));
}
html, body { height: 100%; overflow: hidden; user-select: none; touch-action: none; background: #7e6829; overscroll-behavior: none; }
body { background: #7e6829; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; height: 100dvh; }
#app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #7e6829; padding-top: var(--inset-top); padding-right: var(--inset-right); padding-bottom: var(--inset-bottom); padding-left: var(--inset-left); }

#board { contain: layout paint; transform: translateZ(0); }
.top-panel, .bottom-panel { transform: translateZ(0); }

/* ВЕРХНЯЯ ПАНЕЛЬ */
.top-panel { position: relative; z-index: 4; width: 100%; aspect-ratio: 877 / 188; flex-shrink: 0; margin: 0; overflow: visible; background: none; }
.top-panel::before { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: url('img/ui_top.png') top center / 100% auto no-repeat; }
.val-box, .top-panel .hitbox { z-index: 1; }
.val-box { position: absolute; top: 2.7%; height: 38%; display: flex; align-items: center; justify-content: center; pointer-events: none; gap: 3px; overflow: visible; }
.val-box img.icon { width: auto; object-fit: contain; flex: 0 0 auto; align-self: center; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.45)); }
#score-box { left: 0.8%; width: 37.2%; }
#score-box img.icon { height: 82%; }
#coins-box { left: 39.4%; width: 23.5%; }
#coins-box img.icon { height: 114%; }
#moves-box { left: 64.15%; width: 23.6%; }
#moves-box img.icon { height: 74%; }

.hitbox { position: absolute; cursor: pointer; border-radius: 10px; transition: background 0.1s; }
.hitbox:active { background: rgba(255,255,255,0.2); }
.hit-rating { left: 1.5%; top: 43%; width: 19%; height: 55%; }
.hit-shop { left: 34.5%; top: 43%; width: 19%; height: 55%; }
.hit-pause { left: 65%; top: 43%; width: 16.5%; height: 55%; }
.hit-jurist { left: 81.5%; top: 0; width: 18%; height: 42%; display: flex; justify-content: center; align-items: center; z-index: 6; }
.hit-jurist img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }

/* БЕЙДЖ НА КОНВЕРТЕ (ПОЧТА) */
.mail-badge {
position: absolute;
top: 2px; right: 2px;
background: #ff2a2a;
color: transparent;
font-size: 0;
width: 13px; height: 13px;
border-radius: 50%;
display: none;
border: 2px solid #fff;
z-index: 30;
box-shadow: 0 0 0 1px rgba(90, 0, 0, 0.45);
}
.mail-badge.show { display: block; }
.hit-rating.mail-alert { animation: mailPulse 0.9s ease-in-out infinite; border-radius: 12px; }
@keyframes mailPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 40, 40, 0); }
  50% { box-shadow: 0 0 0 3px rgba(255, 220, 80, 0.5), 0 0 16px 5px rgba(255, 50, 40, 0.95); }
}

.num-container { display: flex; align-items: center; justify-content: center; height: 70%; min-width: 0; max-width: 78%; flex: 0 1 auto; align-self: center; }
.num-container img { height: 100%; width: auto; margin: 0; object-fit: contain; flex: 0 0 auto; align-self: center; }

/* ПОЛЕ */
#board { flex: 1 1 auto; min-height: 0; width: 100%; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 0; background: url('img/board_bg.png') center / 100% 100% no-repeat; border: none; touch-action: none; position: relative; z-index: 3; }
.cell { background: transparent; display: flex; align-items: center; justify-content: center; position: relative; overflow: visible; }
.cell.occupied { background: transparent; }
.cell.settled { background: rgba(0,0,0,0.35); }
.cell.anim-walk, .cell.anim-hop, .cell.anim-shake, .cell.anim-omon,
.cell:has(.piece-pop), .cell:has(.merging) { background: transparent !important; box-shadow: none !important; }
/* Lifted piece: full size, no scale. Soft ellipse sits slightly below and to the right. */
.ghost { position: fixed; left: 0; top: 0; display: flex; align-items: center; justify-content: center; background: none; pointer-events: none; z-index: 2000; overflow: visible; will-change: transform; transition: none; }
.ghost::after { content: ''; position: absolute; left: 52%; top: 82%; width: 34%; height: 16%; background: rgba(0, 0, 0, 0.45); border-radius: 50%; filter: blur(3px); z-index: 0; pointer-events: none; }
/* Cell target: solid white square. Position is set in JS and must not ease. */
#cell-hl { position: fixed; display: none; background: rgba(255, 255, 255, 0.4); pointer-events: none; z-index: 1800; transition: none; }

.cell img, .next-block img, .jail-block img, .ghost img { width: 108%; height: 108%; object-fit: contain; pointer-events: none; display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
.cell span, .next-block span, .jail-block span, .ghost span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }

.cell.large-tile { z-index: 10; }
.cell.large-tile img, .cell.large-tile span { width: 156%; height: 156%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }

/* АНИМАЦИИ */
@keyframes piece-pop { 0% { transform: translate(-50%, -50%) scale(0); } 60% { transform: translate(-50%, -50%) scale(calc(var(--tile-scale, 1) * 1.15)); } 100% { transform: translate(-50%, -50%) scale(var(--tile-scale, 1)); } }
.cell img.piece-pop, .cell span.piece-pop, .next-block img.piece-pop, .next-block span.piece-pop, .jail-block img.piece-pop, .jail-block span.piece-pop { animation: piece-pop 0.26s ease-out forwards; }
@keyframes merge-pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); filter: drop-shadow(0 0 12px #ffd700); } 100% { transform: translate(-50%, -50%) scale(1); } }
.cell.merge-hint img, .cell.merge-hint span, .ghost.merge-hint { animation: merge-pulse 0.48s infinite ease-in-out; z-index: 10; }
@keyframes printer-print { 0% { filter: brightness(1); } 50% { filter: brightness(2) drop-shadow(0 0 15px #00ffff); transform: translate(-50%, -50%) scale(1.1); } 100% { filter: brightness(1); } }
.cell.printer-print img, .cell.printer-print span { animation: printer-print 0.5s ease-in-out; }
@keyframes omonFade { 0% { opacity: 0; } 100% { opacity: 1; } }
.cell.anim-omon { animation: omonFade 0.4s ease-in; }

/* НИЖНЯЯ ПАНЕЛЬ */
.bottom-panel { position: relative; z-index: 4; width: 100%; aspect-ratio: 1320 / 430; flex-shrink: 0; margin: 0; overflow: hidden; background: #5c8a38; }
.bottom-panel::before { content: ''; position: absolute; left: 0; width: 100%; z-index: 0; pointer-events: none; height: calc(100% * 733 / 430); top: calc(100% * -200 / 430); background: url('img/ui_bottom.png') top center / 100% 100% no-repeat; }
.bottom-slots { position: absolute; inset: 0; display: flex; z-index: 1; }
.jail-block { width: 32%; cursor: grab; display: flex; align-items: center; justify-content: center; padding: 10% 8% 10% 10%; }
.next-block { flex: 1; cursor: grab; display: flex; align-items: center; justify-content: center; padding: 10% 6% 10% 4%; }
.hint-block { width: 32%; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10% 10% 10% 8%; }

.jail-block .content, .next-block .content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.next-block .content { transform: translate(-15%, 5%); }
.jail-block .content { transform: translate(-23.7%, 6.5%); }

#log { font-size: 13px; line-height: 1.2; text-align: center; color: #ffe98a; font-weight: 900; text-shadow: 0 1px 0 #2b1a0e, 0 0 6px #2b1a0e; pointer-events: none; position: absolute; left: 4%; right: 4%; top: 100%; margin-top: 2px; height: auto; background: transparent; z-index: 6; }

/* МОДАЛКИ ОБЩИЕ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: calc(10px + var(--inset-top)) calc(10px + var(--inset-right)) calc(10px + var(--inset-bottom)) calc(10px + var(--inset-left)); }
#mail-modal { background: rgba(0, 0, 0, 0.46); }
#mail-modal .modal-content { background: rgba(16, 14, 10, 0.4); border-color: rgba(255, 236, 190, 0.38); box-shadow: 0 12px 36px rgba(0,0,0,0.28); }
#mail-modal h2 { color: #fff8e4; }
.modal.open { display: flex; }
.modal-content { background: #2b1a0e; border: 3px solid #ffd700; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
.modal h2 { text-align: center; color: #ffd700; margin-bottom: 15px; }
.close-btn { width: 100%; padding: 12px; margin-top: 10px; background: #8b3a3a; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

/* ИДЕАЛЬНЫЙ МАГАЗИН (КАРТИНКА + ХИТБОКСЫ) */
.shop-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2600; padding: calc(10px + var(--inset-top)) calc(10px + var(--inset-right)) calc(10px + var(--inset-bottom)) calc(10px + var(--inset-left)); }
.shop-modal.open { display: flex; }
.shop-window {
position: relative;
background: #6b7a4e url('img/shop_bg.png') center / 100% 100% no-repeat;
border: 3px solid #4a2c14;
border-radius: 12px;
width: 100%;
max-width: 360px;
aspect-ratio: 1080 / 1920;
overflow: hidden;
}
.shop-hitbox { position: absolute; cursor: pointer; border-radius: 8px; }
.shop-hitbox:active { background: rgba(255,255,255,0.2); }
.slot-1 { top: 12%; left: 6%; width: 42%; height: 14%; }
.slot-2 { top: 12%; left: 52%; width: 42%; height: 14%; }
.slot-3 { top: 27.5%; left: 6%; width: 42%; height: 14%; }
.slot-4 { top: 27.5%; left: 52%; width: 42%; height: 14%; }
.slot-5 { top: 43%; left: 6%; width: 42%; height: 14%; }
.slot-6 { top: 43%; left: 52%; width: 42%; height: 14%; }
.slot-7 { top: 58.5%; left: 6%; width: 42%; height: 14%; }
.slot-8 { top: 58.5%; left: 52%; width: 42%; height: 14%; }
.slot-9 { top: 74%; left: 6%; width: 42%; height: 14%; }
.slot-10 { top: 74%; left: 52%; width: 42%; height: 14%; }
.slot-close { left: 71.67%; top: 5.25%; width: 8.22%; height: 4.56%; border-radius: 6px; }

/* ИДЕАЛЬНАЯ ПАУЗА */
.pause-window {
background: #93a576 url('img/pause_bg.png') center / 100% 100% no-repeat;
border: 3px solid #4a5c31;
border-radius: 12px;
width: 100%;
max-width: 340px;
height: 75vh;
display: flex;
flex-direction: column;
overflow: hidden;
box-shadow: 0 10px 30px rgba(0,0,0,0.8);
position: relative;
}
.pause-hitbox-top { position: absolute; top: 8%; left: 5%; width: 90%; height: 18%; display: flex; gap: 4px; }
.pause-hitbox-top > div { flex: 1; cursor: pointer; border-radius: 10px; }
.pause-hitbox-top > div:active { background: rgba(255,255,255,0.2); }
.pause-missions-area { position: absolute; top: 30%; left: 5%; width: 90%; height: 48%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.pause-missions-area::-webkit-scrollbar { display: none; }
.mission-img-card { width: 100%; position: relative; }
.mission-img-card img { width: 100%; display: block; border-radius: 8px; }
.pause-hitbox-bottom { position: absolute; bottom: 2%; left: 5%; width: 90%; height: 16%; display: flex; gap: 4px; }
.pause-hitbox-bottom > div { flex: 1; cursor: pointer; border-radius: 10px; }
.pause-hitbox-bottom > div:active { background: rgba(255,255,255,0.2); }

/* ПОЧТА */
.mail-card { width: 100%; cursor: pointer; position: relative; margin-bottom: 8px;}
.mail-card img { width: 100%; display: block; border-radius: 8px; }
.mail-claim-btn { position: absolute; right: 1%; top: 2%; width: 20%; height: 96%; cursor: pointer; border-radius: 8px; }
.mail-claim-btn:active { background: rgba(255,255,255,0.3); }

/* МЕМЫ */
.meme-popup { position: fixed; bottom: 0; right: 0; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5000; pointer-events: none; }
.meme-popup.show { transform: translateX(0); pointer-events: auto; }
.meme-popup.show::before { content: ''; position: fixed; inset: 0; }
.meme-popup img { position: relative; max-height: 60vh; max-width: 90vw; display: block; object-fit: contain; object-position: bottom right; }
.meme-popup.discovery { left: 0; right: 0; width: 100%; display: flex; justify-content: center; }
.meme-popup.discovery img { width: min(100vw, 520px); max-width: 100vw; max-height: 78vh; object-position: center bottom; }

/* КНИГА */
.book-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
.book-tab { flex: 1; padding: 8px; background: #4a2c14; border: 1px solid #8b6f2e; border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; color: #fff;}
.book-tab.active { background: #ffd700; color: #000; border-color: #fff; }
.book-scroll { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; padding-right: 5px; }
.book-card { background: #4a2c14; border: 2px solid #8b6f2e; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; }
.book-card.locked { opacity: 0.5; filter: grayscale(1); }
.book-icon { width: 40px; height: 40px; background: #2b1a0e; border-radius: 6px; display: flex; justify-content: center; align-items: center; margin-bottom: 4px; }
.book-icon img { max-width: 90%; max-height: 90%; object-fit: contain; }
.book-icon span { font-size: 20px; }
.book-desc { font-size: 9px; line-height: 1.1; color: #ccc; margin-bottom: 6px; }

.discovery-popup { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(100px); background: #ffd700; border: 3px solid #8b6f2e; border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; z-index: 3000; opacity: 0; transition: all 0.4s ease; box-shadow: 0 5px 20px rgba(0,0,0,0.6); max-width: 90%; pointer-events: none; }
.discovery-popup.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.disc-img { width: 40px; height: 40px; background: #fff; border-radius: 8px; border: 2px solid #8b6f2e; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
.disc-img img { max-width: 90%; max-height: 90%; object-fit: contain; }
.disc-text { display: flex; flex-direction: column; color: #2b1a0e; }
.disc-title { font-weight: 900; font-size: 14px; text-transform: uppercase; }
.disc-desc { font-size: 11px; font-weight: bold; line-height: 1.1; }

.float-text { position: fixed; pointer-events: none; font-size: 15px; font-weight: 900; color: #ffe98a; text-shadow: 0 2px 0 #5a3b00, 0 0 6px rgba(0,0,0,0.45); z-index: 500; display: flex; align-items: center; gap: 2px; animation: coinPop 1.9s cubic-bezier(.2,.8,.2,1) forwards; }
.float-text img { width: 22px; height: 22px; object-fit: contain; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.35)); }
.float-text img.coin-small { width: 14px; height: 14px; margin-left: -8px; }
@keyframes coinPop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.25); } 16% { opacity: 1; transform: translate(-50%, -12px) scale(1.18); } 32% { opacity: 1; transform: translate(-50%, -2px) scale(1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--float-dx, 0px)), var(--float-dy, -72px)) scale(0.92); } }

/* АНИМАЦИЯ СЛИЯНИЯ */
.merging { transition: transform 0.2s ease-in, opacity 0.2s; z-index: 100; }

/* Пионер: прямой ход между центрами клеток и одно покачивание вокруг ступней.
   Сдвиг — ease-in-out, поворот — один синус (влево, затем вправо). Тайминг линейный, кривые запечены в кадры. */
@keyframes pieceWalk {
0% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 1), calc(var(--dy) * 1)) rotate(0deg); }
5% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9952), calc(var(--dy) * 0.9952)) rotate(-3.71deg); }
10% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9803), calc(var(--dy) * 0.9803)) rotate(-7.05deg); }
15% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9548), calc(var(--dy) * 0.9548)) rotate(-9.71deg); }
20% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.9183), calc(var(--dy) * 0.9183)) rotate(-11.41deg); }
25% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.8708), calc(var(--dy) * 0.8708)) rotate(-12deg); }
30% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.8126), calc(var(--dy) * 0.8126)) rotate(-11.41deg); }
35% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.7445), calc(var(--dy) * 0.7445)) rotate(-9.71deg); }
40% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.6681), calc(var(--dy) * 0.6681)) rotate(-7.05deg); }
45% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.5857), calc(var(--dy) * 0.5857)) rotate(-3.71deg); }
50% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5)) rotate(0deg); }
55% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.4143), calc(var(--dy) * 0.4143)) rotate(3.71deg); }
60% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.3319), calc(var(--dy) * 0.3319)) rotate(7.05deg); }
65% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.2555), calc(var(--dy) * 0.2555)) rotate(9.71deg); }
70% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.1874), calc(var(--dy) * 0.1874)) rotate(11.41deg); }
75% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.1292), calc(var(--dy) * 0.1292)) rotate(12deg); }
80% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0817), calc(var(--dy) * 0.0817)) rotate(11.41deg); }
85% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0452), calc(var(--dy) * 0.0452)) rotate(9.71deg); }
90% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0197), calc(var(--dy) * 0.0197)) rotate(7.05deg); }
95% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.0048), calc(var(--dy) * 0.0048)) rotate(3.71deg); }
100% { transform: translate(-50%, -50%) translate(calc(var(--dx) * 0), calc(var(--dy) * 0)) rotate(0deg); }
}
.cell.anim-walk { z-index: 8; }
.cell.anim-walk > img, .cell.anim-walk > span {
transform-origin: var(--walk-ox, 50%) var(--walk-oy, 80%);
animation: pieceWalk 0.56s linear both;
will-change: transform;
}
@keyframes omonHop {
0% { transform: translate(-50%, -50%) translateY(8px) scale(0.72); opacity: 0.15; }
45% { transform: translate(-50%, -50%) translateY(-14px) scale(1.08); opacity: 1; }
100% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
}
.cell.anim-hop > img, .cell.anim-hop > span { animation: omonHop 0.44s ease-out; will-change: transform; }
@keyframes pieceShake {
0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
18% { transform: translate(-50%, -50%) rotate(-10deg); }
36% { transform: translate(-50%, -50%) rotate(9deg); }
54% { transform: translate(-50%, -50%) rotate(-7deg); }
72% { transform: translate(-50%, -50%) rotate(5deg); }
}
.cell.anim-shake > img, .cell.anim-shake > span { animation: pieceShake 0.4s ease-in-out; transform-origin: 50% 80%; }
@keyframes targetPulse {
0%, 100% { box-shadow: inset 0 0 0 3px rgba(255, 215, 0, 0.35); }
50% { box-shadow: inset 0 0 0 4px #ffe566, 0 0 12px rgba(255, 214, 80, 0.85); }
}
.cell.tut-target { background: rgba(255, 214, 80, 0.38); animation: targetPulse 1s ease-in-out infinite; z-index: 5; }
#next-tile.tut-source { outline: 3px solid #ffe566; outline-offset: -8px; border-radius: 12px; }

.hint-block { position: relative; }
#hint-recipe {
position: absolute;
left: 5%;
right: 8%;
top: 16%;
bottom: 14%;
display: none;
align-items: center;
justify-content: center;
flex-wrap: nowrap;
gap: 1px 2px;
pointer-events: none;
padding: 4px 2px;
}
#hint-recipe.has-recipe {
display: flex;
background: #62844a;
border-radius: 14px;

<script>
const SIZE = 6;
const SAVE_KEY = 'pasha_match_v46';
const SEEN_KEY = 'pasha_match_seen_v46';

const CHAIN = ['💵','🐑','🗳️','🏫','📜','🧑‍💼','🏛️','👔','🤴','👑','👴','🧔','✍️','👨‍🚀','🍕','🏠','🛠️','🚀','🌌','🎩','💼','🏦','🎖️','🗽','🏰','💎','🚁','🛸'];
const LARGE_TILES = [4, 7, 14, 15, 16, 17, 18, 19];
const GAGARIN_LEVEL = 14;
const ROCKET_NOSE = 15;
const ROCKET_BODY = 16;
const ROCKET_TAIL = 17;
const ROCKET_LEVEL = 18;
const CHAIN_RECIPE = {
14: '3 Гагарина → нос. Если нос уже на поле — корпус, затем хвост.',
15: 'Нос ракеты. Вместе с корпусом и хвостом сразу собирается в ракету.',
16: 'Корпус ракеты. Вместе с носом и хвостом сразу собирается в ракету.',
17: 'Хвост ракеты. Вместе с носом и корпусом сразу собирается в ракету.',
18: 'Ракета. Собирается из носа, корпуса и хвоста.'
};
function isRocketPartLevel(level) {
return level === ROCKET_NOSE || level === ROCKET_BODY || level === ROCKET_TAIL;
}
function findChainLevel(level) {
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
const t = grid[r][c];
if (t && t.kind === 'chain' && t.level === level) return [r, c];
}
return null;
}
function nextGagarinLevel() {
if (!findChainLevel(ROCKET_NOSE)) return ROCKET_NOSE;
if (!findChainLevel(ROCKET_BODY)) return ROCKET_BODY;
return ROCKET_TAIL;
}
function rocketTrio() {
const nose = findChainLevel(ROCKET_NOSE);
const body = findChainLevel(ROCKET_BODY);
const tail = findChainLevel(ROCKET_TAIL);
if (!nose || !body || !tail) return null;
return { nose: nose, body: body, tail: tail };
}
const CARE = ['🐻','🪙','🥇','🏛️','📜','💰','🏦','👑','🌍','🚀','🦁','🐯','🐘','🐳','🦅','🦉','🦄','🐉','👽','🛸'];
const INCOME = ['💻','📺','🏦','🏢','🥚'];
const INCOME_PER_TURN = [5, 15, 50, 150, 500];

let grid = [], score = 0, coins = 0, moves = 0;
let nextTile = null, jailTile = null, bufferedNext = null, drag = null, undoState = null;
let isSawMode = false, isNanoboxMode = false;
let testSpawnIndex = 0;
let discovered = new Set();
let sawStreak = 0;
let gameOver = false;
let moveAnims = [];
let busyUntil = 0;
let tutorial = { active: false, index: 0 };
let fingerSig = '';
let tutMute = false;
const TUT_KEY = 'pasha_tutorial_done_v1';
const SFX_KEY = 'pasha_sfx_muted';
let sfxMuted = false;
try { sfxMuted = localStorage.getItem(SFX_KEY) === '1'; } catch (e) {}
let audioCtx = null;
let moneyBags = 0;
let mailAlert = false;
let rocketBusy = false;

// Статусы заданий: 'active' - висит в паузе, 'completed' - висит в почте, 'claimed' - исчезло
let missions = {
forest: { status: 'active', reward: 1400, img: 'img/mission_forest.png' },
elections: { status: 'active', reward: 2800, img: 'img/mission_elections.png' },
saw: { status: 'active', reward: 5000, img: 'img/mission_saw.png' }
};

function loadDiscovered() { try { let r = localStorage.getItem(SEEN_KEY); if(r) discovered = new Set(JSON.parse(r)); } catch(e){} }
function saveDiscovered() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(discovered))); } catch(e){} }
loadDiscovered();

function renderNumber(num, containerId) {
const el = document.getElementById(containerId);
el.innerHTML = '';
const str = num.toString();
for (let i = 0; i < str.length; i++) {
const digit = str[i];
const img = document.createElement('img');
img.src = `img/num_${digit}.png`;
img.onload = fitNumbers;
img.onerror = function() {
this.style.display = 'none';
const span = document.createElement('span');
span.textContent = digit;
span.style.fontSize = '16px';
span.style.color = '#ffd700';
span.style.fontWeight = 'bold';
el.appendChild(span);
fitNumbers();
};
el.appendChild(img);
}
}
function fitNumbers() {
const boxes = [...document.querySelectorAll('.val-box')];
let size = Infinity;
boxes.forEach(box => {
const nums = box.querySelector('.num-container');
if (!nums) return;
const imgs = [...nums.querySelectorAll('img')].filter(img => img.style.display !== 'none');
if (!imgs.length) return;
const icon = box.querySelector('img.icon');
const iconW = icon ? icon.getBoundingClientRect().width : 0;
const avail = Math.max(12, box.clientWidth - iconW - 6);
const h = Math.max(10, box.clientHeight * 0.62);
size = Math.min(size, h, avail / imgs.length);
});
if (!isFinite(size)) return;
boxes.forEach(box => {
const nums = box.querySelector('.num-container');
if (!nums) return;
nums.querySelectorAll('img').forEach(img => {
if (img.style.display === 'none') return;
img.style.height = size + 'px';
img.style.width = size + 'px';
});
});
}

function getTileImage(tile) {
if (!tile) return null;
if (tile.kind === 'chain') return `img/pasha_${tile.level < 10 ? '0'+tile.level : tile.level}.png`;
if (tile.kind === 'care') return `img/bear_${tile.level}.png`;
if (tile.kind === 'income') return `img/income_${tile.level}.png`;
if (tile.kind === 'omon') return tile.level === 1 ? 'img/omon_1.png' : 'img/omon_2.png';
if (tile.kind === 'pioneer') return 'img/Pioner_1.png';
if (tile.kind === 'tool') return `img/tool_${tile.tool}.png`;
return null;
}

function tileEmoji(tile) {
if (tile.kind === 'chain') return CHAIN[tile.level - 1] || '?';
if (tile.kind === 'care') return CARE[tile.level - 1] || '?';
if (tile.kind === 'income') return INCOME[tile.level - 1] || '?';
if (tile.kind === 'omon') return '🚔';
if (tile.kind === 'pioneer') return '🧑‍🎓';
if (tile.kind === 'tool') return '🛠️';
return '?';
}

function tileRestScale() {
return 1;
}

function makeTileContent(tile) {
let imgSrc = getTileImage(tile);
if (imgSrc) {
let img = document.createElement('img');
img.src = imgSrc;
let scale = tileRestScale(tile);
if (scale !== 1) {
img.style.setProperty('--tile-scale', String(scale));
img.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
}
img.onerror = function() { this.parentNode.innerHTML = '<span style="font-size:32px;">' + tileEmoji(tile) + '</span>'; };
return img;
} else {
let span = document.createElement('span');
span.style.fontSize = '32px';
span.textContent = tileEmoji(tile);
return span;
}
}

function checkDiscovery(tile) {
if (!tile) return;
let key = tile.kind + '_' + (tile.level || '');
if (tile.kind === 'tool') key = 'tool_' + tile.tool;
if (discovered.has(key)) return;
discovered.add(key);
saveDiscovered();
if (tutorial.active) return;
if (tile.kind === 'care' && tile.level === 2) showMeme('img/discovery-deputy.jpg', true);
else if (tile.kind === 'care' && tile.level === 3) showMeme('img/discovery-gold-coin.jpg', true);

function unifyTrayPieces() {
const cell = document.querySelector('#board .cell');
if (!cell) return;
const r = cell.getBoundingClientRect();

function findGroup(startR, startC, tempGrid = null) {
let g = tempGrid || grid;
const start = g[startR][startC];
if (!start || start.kind === 'omon' || start.kind === 'pioneer' || start.kind === 'tool') return null;
if (start.kind === 'chain' && isRocketPartLevel(start.level)) return null;
let visited = {}, stack = [[startR, startC]], group = [];
while (stack.length) {
const [r, c] = stack.pop();
const key = r + ',' + c;
if (visited[key]) continue;
if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) continue;
const t = g[r][c];
if (!t || t.kind !== start.kind || t.level !== start.level) continue;
visited[key] = true;
group.push([r, c]);
stack.push([r-1, c], [r+1, c], [r, c-1], [r, c+1]);
}
return group;
}

function processCascades(anchorR, anchorC, isSackMerge = false) {
let cas = 0;
while (cas < 50) {
const group = findGroup(anchorR, anchorC);
if (!group || group.length < 3) break;

const tile = grid[anchorR][anchorC];
const lvl = tile.level, kind = tile.kind;
const maxL = kind === 'chain' ? CHAIN.length : (kind === 'care' ? CARE.length : INCOME.length);
if (lvl >= maxL) break;

group.forEach(([r, c]) => {
let cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
if (cell) {
clearShade(cell);
let img = cell.querySelector('img') || cell.querySelector('span');
if (img) {
let dx = (anchorC - c) * 100;
let dy = (anchorR - r) * 100;
img.classList.add('merging');
img.style.transform = `translate(-50%, -50%) translate(${dx}%, ${dy}%) scale(0.5)`;
img.style.opacity = '0';
}
}
});

setTimeout(() => {
group.forEach(([r, c]) => grid[r][c] = null);
let newLevel = lvl + 1;

if (kind === 'chain' && lvl === GAGARIN_LEVEL) newLevel = nextGagarinLevel();

if (kind === 'chain' && (newLevel === 5 || newLevel === 9)) {
const memeKey = 'meme_chain_' + newLevel;
const memeSrc = newLevel === 5 ? 'img/popup_urna.png' : 'img/popup_president.png';
if (!discovered.has(memeKey)) {
discovered.add(memeKey);
saveDiscovered();
showMeme(memeSrc);
}
}

if (kind === 'care' && lvl === 3 && newLevel === 4) showDiscoveryOnce('disc_building', 'img/discovery-building.jpg');

if (kind === 'chain' && lvl === 8 && newLevel === 9 && !isSackMerge) completeMission('elections');

grid[anchorR][anchorC] = { kind, level: newLevel, pop: true };
checkDiscovery(grid[anchorR][anchorC]);
sfx('merge');
notifyTutorial({ type: 'merge', tile: grid[anchorR][anchorC], r: anchorR, c: anchorC });

score += lvl * 15 * group.length;
coins += lvl * 2 * group.length;

render();

if (kind === 'chain' && isRocketPartLevel(newLevel) && rocketTrio()) queueRocketAssembly(anchorR, anchorC);
else setTimeout(() => { processCascades(anchorR, anchorC); }, 100);
}, 200);

cas++;
break;
}
}

function cellPx() {
const board = document.getElementById('board');
return (board && board.clientWidth ? board.clientWidth : 240) / SIZE;
}

function pioneerOptions(r, c) {
let empty = [], money = [];
[[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(d => {
let nr = r + d[0], nc = c + d[1];
if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return;
const t = grid[nr][nc];
if (!t) empty.push({ r: nr, c: nc, type: 'empty' });
else if (t.kind === 'chain' && t.level === 1) money.push({ r: nr, c: nc, type: 'money' });
});
return { empty, money, blocked: empty.length + money.length === 0 };
}

function stepPioneers() {
let pioneers = [];
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
if (grid[r][c] && grid[r][c].kind === 'pioneer') pioneers.push([r, c]);
}
let moved = false;
const px = cellPx();
const taken = {};
pioneers.forEach(([r, c]) => {
if (!grid[r][c] || grid[r][c].kind !== 'pioneer') return;
const opt = pioneerOptions(r, c);
let pool = (opt.money.length ? opt.money : opt.empty).filter(p => !taken[p.r + ',' + p.c]);
if (!pool.length) return;
let move = pool[Math.floor(Math.random() * pool.length)];
taken[move.r + ',' + move.c] = true;
if (move.type === 'money') { coins += 20; showFloatText(move.r, move.c, 20); }
grid[move.r][move.c] = { kind: 'pioneer' };
grid[r][c] = null;
moveAnims.push({ r: move.r, c: move.c, dx: (c - move.c) * px + 'px', dy: (r - move.r) * px + 'px', hop: false });
moved = true;
});
if (moved) sfx('step');
}

function trappedPioneers() {
let trapped = [];
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
if (grid[r][c] && grid[r][c].kind === 'pioneer' && pioneerOptions(r, c).blocked) trapped.push([r, c]);
}
return trapped;
}
function convertTrapped(trapped) {
trapped.forEach(([r, c]) => {
if (!grid[r][c] || grid[r][c].kind !== 'pioneer') return;
grid[r][c] = { kind: 'care', level: 1, pop: true };
checkDiscovery(grid[r][c]);
processCascades(r, c);
});
if (trapped.length) notifyTutorial({ type: 'trap', n: trapped.length });
render();
saveGame();
checkGameOver();
}

function omonJumpTargets(r, c, level) {
let empty = [];
for (let r2 = 0; r2 < SIZE; r2++) for (let c2 = 0; c2 < SIZE; c2++) {
if (grid[r2][c2]) continue;
let dist = Math.max(Math.abs(r2 - r), Math.abs(c2 - c));
if (dist === 0) continue;
empty.push({ r: r2, c: c2, dist });
}
if (!empty.length) return empty;
if (level >= 2) {
let far = empty.filter(e => e.dist >= 3);
if (far.length) return far;
} else {
let mid = empty.filter(e => e.dist >= 2 && e.dist <= 3);
if (mid.length) return mid;
}
return empty;
}

function stepOmons(omons) {
let taken = {};
omons.forEach(([r, c]) => {
if (!grid[r][c] || grid[r][c].kind !== 'omon') return;
let level = grid[r][c].level || 1;
let pool = omonJumpTargets(r, c, level).filter(p => !taken[p.r + ',' + p.c]);
if (!pool.length) return;
let p = pool[Math.floor(Math.random() * pool.length)];
taken[p.r + ',' + p.c] = true;
let tile = grid[r][c];
grid[r][c] = null;
grid[p.r][p.c] = tile;
moveAnims.push({ r: p.r, c: p.c, hop: true });
});
}

function finishUnits() {
stepPioneers();
if (!tutorial.active && moves % 50 === 0) nextTile = { kind: 'omon', level: Math.random() < 0.5 ? 1 : 2, pop: true };

function endMove() {

/* Ступни пионера в исходнике Pioner_1.png (низ непрозрачных пикселей, центр по ширине). */
const PIONEER_FEET = { x: 0.5, y: 1105 / 1296, w: 1520, h: 1296 };

function pioneerFeetOrigin(el) {
if (!el || el.tagName !== 'IMG') return ['50%', '100%'];
const board = document.getElementById('board');
const bw = board ? board.clientWidth : 0;
const bh = board ? board.clientHeight : 0;
const nw = el.naturalWidth || PIONEER_FEET.w;
const nh = el.naturalHeight || PIONEER_FEET.h;
if (!bw || !bh || !nw || !nh) return ['50%', '80%'];
const ew = bw / SIZE * 1.08;
const eh = bh / SIZE * 1.08;
const scale = Math.min(ew / nw, eh / nh);
const rw = nw * scale;
const rh = nh * scale;
const padX = (ew - rw) / 2;
const padY = (eh - rh) / 2;
const x = (padX + PIONEER_FEET.x * rw) / ew * 100;
const y = (padY + PIONEER_FEET.y * rh) / eh * 100;
return [x.toFixed(2) + '%', y.toFixed(2) + '%'];
}

function clearShade(cell) {
if (!cell) return;
cell.classList.remove('settled');
cell.style.setProperty('background-color', 'transparent', 'important');
}
function showShade(cell) {
if (!cell || !cell.isConnected || !cell.querySelector('img, span')) return;
if (cell.classList.contains('anim-walk') || cell.classList.contains('anim-hop') || cell.classList.contains('anim-shake') || cell.classList.contains('anim-omon')) return;
if (cell.querySelector('.piece-pop, .merging')) return;
cell.style.removeProperty('background-color');
cell.classList.add('settled');
}
function applyMoveAnim(cell, r, c) {
if (!moveAnims.length) return;
const anim = moveAnims.find(a => a.r === r && a.c === c);
if (!anim) return;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { showShade(cell); return; }
const img = cell.querySelector('img, span');
clearShade(cell);
if (anim.hop) cell.classList.add('anim-hop');
else if (img) {
const origin = pioneerFeetOrigin(img);
img.style.setProperty('--dx', anim.dx || '0px');
img.style.setProperty('--dy', anim.dy || '0px');
img.style.setProperty('--walk-ox', origin[0]);
img.style.setProperty('--walk-oy', origin[1]);
cell.classList.add('anim-walk');
}
const ms = anim.hop ? 480 : 620;
setTimeout(() => {
cell.classList.remove('anim-walk', 'anim-hop');
showShade(cell);
}, ms);
}
function queueRocketAssembly(preferR, preferC) {

rocketBusy = true;
markBusy(1100);

if (!trio) { rocketBusy = false; return; }

setTimeout(() => {
parts.forEach(([r, c]) => { grid[r][c] = null; });
grid[target[0]][target[1]] = { kind: 'chain', level: ROCKET_LEVEL, pop: true };

coins += 17 * 2 * 3;

function placeGhost(clientX, clientY) {
if (!drag || !drag.ghost) return;
const x = clientX - drag.offsetX;
const y = clientY - drag.offsetY;
drag.ghost.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
}

function hideCellHighlight() {
const hl = document.getElementById('cell-hl');
if (!hl) return;
hl.style.display = 'none';
if (drag) drag.hlCell = null;
}

function updateCellHighlight(clientX, clientY) {
const hl = document.getElementById('cell-hl');
if (!hl) return;
const hit = document.elementFromPoint(clientX, clientY);
const cell = hit && hit.closest ? hit.closest('.cell') : null;
if (!cell) { hideCellHighlight(); return; }
if (drag && drag.hlCell === cell) return;
if (drag) drag.hlCell = cell;
const rect = cell.getBoundingClientRect();
hl.style.display = 'block';
hl.style.left = rect.left + 'px';
hl.style.top = rect.top + 'px';
hl.style.width = rect.width + 'px';
hl.style.height = rect.height + 'px';
}

function detachDragListeners() {
window.removeEventListener('pointermove', onMove);
window.removeEventListener('pointerup', onUp);
window.removeEventListener('pointercancel', onCancel);
}

function clearDragVisuals() {
if (drag && drag.ghost) drag.ghost.remove();
hideCellHighlight();
}

function startTrayDrag(e, type, tile) {
if (!tile || isSawMode || isNanoboxMode || gameOver || isBusy() || tutorialBlocksBoard()) return;
e.preventDefault();
if (drag) { detachDragListeners(); clearDragVisuals(); drag = null; }
const rect = document.querySelector('.cell').getBoundingClientRect();
const ghost = document.createElement('div');
ghost.className = 'ghost';
ghost.style.width = rect.width + 'px';
ghost.style.height = rect.height + 'px';
ghost.appendChild(makeTileContent(tile));
document.body.appendChild(ghost);
drag = { type: type, ghost: ghost, offsetX: rect.width / 2, offsetY: rect.height / 2, hlCell: null };
placeGhost(e.clientX, e.clientY);
updateCellHighlight(e.clientX, e.clientY);
try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch(_) {}
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onCancel);
}

document.getElementById('next-tile').addEventListener('pointerdown', e => {
startTrayDrag(e, 'fromNext', nextTile);
});

document.getElementById('jail').addEventListener('pointerdown', e => {
startTrayDrag(e, 'fromJail', jailTile);
});

function onMove(e) {
if (!drag) return;
placeGhost(e.clientX, e.clientY);
updateCellHighlight(e.clientX, e.clientY);
}

function onCancel() {
if (!drag) return;
detachDragListeners();
clearDragVisuals();
drag = null;
}

function onUp(e) {
if (!drag) return;
detachDragListeners();
clearDragVisuals();

const el = document.elementFromPoint(e.clientX, e.clientY);
const cell = el?.closest('.cell');

if (tutorialReject(el, cell)) { drag = null; return; }

// ИЗ ТЮРЬМЫ
if (drag.type === 'fromJail') {
if (cell) {
const r = +cell.dataset.r, c = +cell.dataset.c;

if (jailTile.kind === 'tool') {
// Применение инструмента из тюрьмы
undoState = { grid: grid.map(row => row.map(t => t ? {...t} : null)), score, coins, moves, nextTile: {...nextTile}, jailTile: {...jailTile}, bufferedNext: bufferedNext ? {...bufferedNext} : null };
let tool = jailTile;
jailTile = null;

if (tool.tool === 'jurist') {
if (grid[r][c] && grid[r][c].kind !== 'omon') {
let taken = grid[r][c]; grid[r][c] = null;
nextTile = taken;
sfx('pop');
endMove();
} else { render(); }
}
else if (tool.tool === 'saw') {
if (grid[r][c]) {
playSawFx(r, c);
if (grid[r][c].kind === 'omon' || grid[r][c].kind === 'pioneer') {
grid[r][c] = { kind: 'care', level: 1 }; checkDiscovery(grid[r][c]); processCascades(r, c);
} else {
grid[r][c] = null;
}
endMove();
} else { sfx('weed'); render(); }
}
else if (tool.tool === 'nanobox') {
if (grid[r][c]) {
nextTile = { ...grid[r][c] };
render(); saveGame();
} else { render(); }
}
else if (tool.tool === 'sack') {
if (!grid[r][c]) {
let neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]], tryKinds = [];
for (let i = 0; i < neighbors.length; i++) {
let nr = neighbors[i][0], nc = neighbors[i][1];
if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
let nt = grid[nr][nc];
if (!nt || nt.kind === 'omon' || nt.kind === 'pioneer' || nt.kind === 'tool' || (nt.kind === 'chain' && isRocketPartLevel(nt.level))) continue;
let found = false;
for (let k = 0; k < tryKinds.length; k++) if (tryKinds[k].kind === nt.kind && tryKinds[k].level === nt.level) { found = true; break; }
if (!found) tryKinds.push({ kind: nt.kind, level: nt.level });
}
tryKinds.sort((a, b) => {
if (a.kind === 'income' && b.kind !== 'income') return -1;
if (b.kind === 'income' && a.kind !== 'income') return 1;
return b.level - a.level;
});
let merged = false;
for (let j = 0; j < tryKinds.length; j++) {
let tk = tryKinds[j]; grid[r][c] = { kind: tk.kind, level: tk.level };
let grp = findGroup(r, c);
let maxL = tk.kind === 'chain' ? CHAIN.length : (tk.kind === 'care' ? CARE.length : INCOME.length);
if (grp && grp.length >= 3 && tk.level < maxL) { processCascades(r, c); merged = true; break; }
grid[r][c] = null;
}
if (!merged) { grid[r][c] = { kind: 'income', level: 1 }; if (findGroup(r, c) && findGroup(r, c).length >= 3) processCascades(r, c); }
endMove();
} else { render(); }
}
return;
} else {
// Обычная фишка из тюрьмы
if (!grid[r][c]) {
undoState = { grid: grid.map(row => row.map(t => t ? {...t} : null)), score, coins, moves, nextTile: {...nextTile}, jailTile: {...jailTile}, bufferedNext: bufferedNext ? {...bufferedNext} : null };
grid[r][c] = jailTile;
jailTile = null;
noteBoardMoney(grid[r][c]);
checkDiscovery(grid[r][c]);
if (grid[r][c].kind === 'omon') grid[r][c].skipMove = true;
processCascades(r, c);
endMove();
sfx('place');
queueRocketAssembly(r, c);
}
}
}
drag = null;
return;
}

// В ТЮРЬМУ
if (el && el.closest('#jail')) {
if (drag.type === 'fromNext') {
if (jailTile) bufferedNext = jailTile;
jailTile = nextTile;
nextTile = bufferedNext || dealNext();
bufferedNext = null;
render(); saveGame();
sfx('place');
notifyTutorial({ type: 'jail' });
drag = null;
return;
}
}

// НА ПОЛЕ ИЗ ДАЛЕЕ
if (cell) {
const r = +cell.dataset.r, c = +cell.dataset.c;

if (nextTile && nextTile.kind === 'tool') {
if (nextTile.tool !== 'sack' && !grid[r][c]) {
document.getElementById('log').textContent = 'Инструмент нужно кидать на фишку!';
if (nextTile.tool === 'saw') sfx('weed');
drag = null;
return;
}

undoState = { grid: grid.map(row => row.map(t => t ? {...t} : null)), score, coins, moves, nextTile: {...nextTile}, jailTile: jailTile ? {...jailTile} : null, bufferedNext: bufferedNext ? {...bufferedNext} : null };

if (nextTile.tool === 'jurist') {
nextTile = grid[r][c]; grid[r][c] = null;
sfx('pop');
render(); saveGame();
notifyTutorial({ type: 'jurist' });
drag = null;
return;
}
else if (nextTile.tool === 'saw') {
playSawFx(r, c);
if (grid[r][c].kind === 'omon' || grid[r][c].kind === 'pioneer') {
grid[r][c] = { kind: 'care', level: 1 }; checkDiscovery(grid[r][c]); processCascades(r, c);
} else {
grid[r][c] = null;
}
nextTile = bufferedNext || dealNext();
bufferedNext = null;

sawStreak++;
if (sawStreak >= 2) completeMission('saw');
}
else if (nextTile.tool === 'nanobox') {
nextTile = { ...grid[r][c] };
sfx('ui');
}
else if (nextTile.tool === 'sack') {
if (grid[r][c]) {
document.getElementById('log').textContent = 'Мешок нужно ставить на пустую клетку!';
drag = null; return;
}

let neighbors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]], tryKinds = [];
for (let i = 0; i < neighbors.length; i++) {
let nr = neighbors[i][0], nc = neighbors[i][1];
if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
let nt = grid[nr][nc];
if (!nt || nt.kind === 'omon' || nt.kind === 'pioneer' || nt.kind === 'tool' || (nt.kind === 'chain' && isRocketPartLevel(nt.level))) continue;
let found = false;
for (let k = 0; k < tryKinds.length; k++) if (tryKinds[k].kind === nt.kind && tryKinds[k].level === nt.level) { found = true; break; }
if (!found) tryKinds.push({ kind: nt.kind, level: nt.level });
}

tryKinds.sort((a, b) => {
if (a.kind === 'income' && b.kind !== 'income') return -1;
if (b.kind === 'income' && a.kind !== 'income') return 1;
return b.level - a.level;
});

let merged = false;
for (let j = 0; j < tryKinds.length; j++) {
let tk = tryKinds[j];
grid[r][c] = { kind: tk.kind, level: tk.level };
let grp = findGroup(r, c);
let maxL = tk.kind === 'chain' ? CHAIN.length : (tk.kind === 'care' ? CARE.length : INCOME.length);
if (grp && grp.length >= 3 && tk.level < maxL) {
processCascades(r, c); merged = true; break;
}
grid[r][c] = null;
}

if (!merged) {
grid[r][c] = { kind: 'income', level: 1 };
if (findGroup(r, c) && findGroup(r, c).length >= 3) processCascades(r, c);
}

nextTile = bufferedNext || dealNext();
bufferedNext = null;
endMove();
sfx('place');
markBusy(480);
notifyTutorial({ type: 'sack' });
drag = null;
return;
}
render(); saveGame(); drag = null;
return;
}

if (!grid[r][c]) {
undoState = { grid: grid.map(row => row.map(t => t ? {...t} : null)), score, coins, moves, nextTile: {...nextTile}, jailTile: jailTile ? {...jailTile} : null, bufferedNext: bufferedNext ? {...bufferedNext} : null };
grid[r][c] = nextTile;
noteBoardMoney(nextTile);
checkDiscovery(nextTile);
if (nextTile.kind === 'omon') grid[r][c].skipMove = true;

let isSack = false;
if (nextTile.tool === 'sack') isSack = true;

processCascades(r, c, isSack);
nextTile = bufferedNext || dealNext();
bufferedNext = null;
endMove();
sfx('place');
markBusy(480);
queueRocketAssembly(r, c);
notifyTutorial({ type: 'placed' });
}
}
drag = null;
}

return false;

function firstEmpty() {

function hideTutorial() {
tutorial.active = false;
tutorial.step = null;
fingerSig = '';
const t = document.getElementById('tutorial');
if (t) t.classList.remove('on');
const f = document.getElementById('tut-finger');
if (f) { f.getAnimations().forEach(a => a.cancel()); f.style.display = 'none'; }
const a = document.getElementById('tut-arrow');
if (a) a.style.display = 'none';
const n = document.getElementById('next-tile');
if (n) n.classList.remove('tut-source');
}

function showFinger(fromEl, toEl) {
const f = document.getElementById('tut-finger');
if (!f || !fromEl || !toEl) { if (f) f.style.display = 'none'; return; }
f.style.display = 'block';
f.getAnimations().forEach(a => a.cancel());
const a = fromEl.getBoundingClientRect();
const b = toEl.getBoundingClientRect();
const x1 = a.left + a.width / 2 - 23;
const y1 = a.top + a.height / 2 - 4;
const x2 = b.left + b.width / 2 - 23;
const y2 = b.top + b.height / 2 - 4;
f.animate([
{ transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(1)', offset: 0 },
{ transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(0.86)', offset: 0.18 },
{ transform: 'translate(' + x2 + 'px,' + y2 + 'px) scale(1)', offset: 0.72 },
{ transform: 'translate(' + x2 + 'px,' + y2 + 'px) scale(1)', offset: 1 }
], { duration: 1500, iterations: Infinity, easing: 'ease-in-out' });
}

function pointArrow(el, symbol, place) {
const root = document.getElementById('tutorial');
const arrow = document.getElementById('tut-arrow');
if (!root || !arrow || !el) return;
const rb = root.getBoundingClientRect();
const r = el.getBoundingClientRect();
arrow.textContent = symbol || '⬆';
arrow.style.display = 'block';
arrow.style.left = (r.left - rb.left + r.width / 2 - 16) + 'px';
if (place === 'shop') arrow.style.top = (r.top - rb.top + r.height * 0.05) + 'px';
else if (place === 'above') arrow.style.top = (r.top - rb.top - 44) + 'px';
else arrow.style.top = (r.bottom - rb.top + 2) + 'px';
}

function layoutTutorial() {
if (!tutorial.active || !tutorial.step) return;
const step = tutorial.step;
const sug = step.suggest ? step.suggest.r + ',' + step.suggest.c : '';
const exp = step.expect && step.expect.r != null ? step.expect.r + ',' + step.expect.c : '';
const sig = tutorial.index + ':' + sug + ':' + exp;
if (sig === fingerSig) return;
fingerSig = sig;
const finger = document.getElementById('tut-finger');
const arrow = document.getElementById('tut-arrow');
const nextEl = document.getElementById('next-tile');
if (nextEl) nextEl.classList.toggle('tut-source', step.mode === 'action' && !(step.expect && step.expect.shop));
if (step.finger) {
const pair = step.finger();
if (pair) showFinger(document.querySelector(pair[0]), document.querySelector(pair[1]));
else if (finger) finger.style.display = 'none';
} else if (finger) {
finger.getAnimations().forEach(a => a.cancel());
finger.style.display = 'none';
}
if (step.arrow) {
const spec = step.arrow();
pointArrow(document.querySelector(spec[0]), spec[1], spec[2]);
} else if (arrow) arrow.style.display = 'none';
}

function enterStep() {
const step = TUT_STEPS[tutorial.index];
if (!step) { completeTutorial(); return; }
tutorial.step = step;
if (step.enter) step.enter();
if (step.expect && step.expect.any) {
const spot = firstEmpty();
step.suggest = spot ? { r: spot[0], c: spot[1] } : null;
} else step.suggest = null;
fingerSig = '';
const bubble = document.getElementById('tut-bubble');
if (bubble) bubble.classList.toggle('tut-low', !!step.bubbleLow);
document.getElementById('tut-text').textContent = step.text;
const next = document.getElementById('tut-next');
const skip = document.getElementById('tut-skip');
if (step.done) { next.style.display = ''; next.textContent = 'Играть'; skip.style.display = 'none'; }
else if (step.mode === 'info') { next.style.display = ''; next.textContent = 'Дальше'; skip.style.display = ''; }
else { next.style.display = 'none'; skip.style.display = ''; }
document.getElementById('tutorial').classList.add('on');
tutorial.active = true;
render();
}

function advanceTutorial() {
tutorial.index++;
enterStep();
}

function tutNext() {

function ensureAudio() {

function envTone(ctx, freq, t, dur, type, gain) {
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = type;
o.frequency.setValueAtTime(freq, t);
g.gain.setValueAtTime(gain, t);
g.gain.exponentialRampToValueAtTime(0.001, t + dur);
o.connect(g); g.connect(ctx.destination);
o.start(t); o.stop(t + dur + 0.02);
}

function sfx(name) {
const ctx = ensureAudio();
if (!ctx) return;
const t = ctx.currentTime;
if (name === 'place') {
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(160, t);
o.frequency.exponentialRampToValueAtTime(55, t + 0.12);
g.gain.setValueAtTime(0.28, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
o.connect(g); g.connect(ctx.destination);
o.start(t); o.stop(t + 0.15);
} else if (name === 'merge') {
envTone(ctx, 523, t, 0.12, 'sine', 0.16);
envTone(ctx, 659, t + 0.07, 0.14, 'sine', 0.14);
envTone(ctx, 784, t + 0.14, 0.18, 'triangle', 0.12);
} else if (name === 'step') {
envTone(ctx, 990, t, 0.035, 'square', 0.03);
} else if (name === 'ui') {
envTone(ctx, 740, t, 0.045, 'square', 0.04);
} else if (name === 'mail') {
envTone(ctx, 880, t, 0.07, 'sine', 0.14);
envTone(ctx, 1320, t + 0.08, 0.16, 'sine', 0.11);
} else if (name === 'trap') {
marimbaNote(ctx, t, 698, 0.2, 0.2);
marimbaNote(ctx, t + 0.13, 466, 0.22, 0.18);
} else if (name === 'pop') {
corkPop(ctx, t);
} else if (name === 'saw') {
handSaw(ctx, t);
} else if (name === 'weed') {
weedStab(ctx, t);
weedStab(ctx, t + 0.09);
}
}

function corkPop(ctx, t) {
noiseBurst(ctx, t, 0.07, 1400, 280, 0.42, 0.8);
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(480, t);
o.frequency.exponentialRampToValueAtTime(120, t + 0.08);
g.gain.setValueAtTime(0.2, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
o.connect(g); g.connect(ctx.destination);
o.start(t); o.stop(t + 0.1);
}

function noiseBurst(ctx, t, dur, fromFreq, toFreq, gainVal, q) {
const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
const data = buf.getChannelData(0);
for (let i = 0; i < frames; i++) {
const p = i / frames;
data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * p);
}
const src = ctx.createBufferSource();
src.buffer = buf;
const f = ctx.createBiquadFilter();
f.type = 'bandpass';
f.Q.value = q || 3;
f.frequency.setValueAtTime(fromFreq, t);
f.frequency.exponentialRampToValueAtTime(Math.max(40, toFreq), t + dur);
const g = ctx.createGain();
g.gain.setValueAtTime(0.0001, t);
g.gain.linearRampToValueAtTime(gainVal, t + Math.min(0.025, dur * 0.15));
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
src.connect(f); f.connect(g); g.connect(ctx.destination);
src.start(t);
src.stop(t + dur + 0.02);
}

function woodyRasp(ctx, t, dur, f0, f1) {
const rate = ctx.sampleRate;
const frames = Math.max(1, Math.floor(rate * dur));
const buf = ctx.createBuffer(1, frames, rate);
const data = buf.getChannelData(0);
for (let i = 0; i < frames; i++) {
const p = i / frames;
const phase = ((i / rate) * 52) % 1;
const tooth = Math.pow(1 - phase, 2.15);
const stroke = Math.sin(Math.PI * p);
data[i] = (Math.random() * 2 - 1) * tooth * stroke;
}
const src = ctx.createBufferSource();
src.buffer = buf;
const bp = ctx.createBiquadFilter();
bp.type = 'bandpass';
bp.Q.value = 0.65;
bp.frequency.setValueAtTime(Math.max(90, f0), t);
bp.frequency.exponentialRampToValueAtTime(Math.max(90, f1), t + dur);
const g = ctx.createGain();
g.gain.setValueAtTime(0.58, t);
src.connect(bp); bp.connect(g); g.connect(ctx.destination);
src.start(t); src.stop(t + dur + 0.02);
const o = ctx.createOscillator();
const og = ctx.createGain();
o.type = 'triangle';
const w0 = f0 > f1 ? 148 : 92;
const w1 = f0 > f1 ? 84 : 142;
o.frequency.setValueAtTime(w0, t);
o.frequency.exponentialRampToValueAtTime(w1, t + dur);
og.gain.setValueAtTime(0.0001, t);
og.gain.linearRampToValueAtTime(0.085, t + 0.03);
og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.connect(og); og.connect(ctx.destination);
o.start(t); o.stop(t + dur + 0.02);
}
function handSaw(ctx, t0) {
woodyRasp(ctx, t0 + 0.00, 0.22, 1680, 620);
woodyRasp(ctx, t0 + 0.24, 0.22, 600, 1560);
woodyRasp(ctx, t0 + 0.48, 0.22, 1740, 680);
woodyRasp(ctx, t0 + 0.72, 0.24, 640, 1480);
}
function sawStroke(ctx, t) {
const dur = 0.47;
noiseBurst(ctx, t, dur, 720, 240, 0.3, 1.6);
noiseBurst(ctx, t, dur * 0.92, 1280, 480, 0.11, 5);
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'triangle';
o.frequency.setValueAtTime(168, t);
o.frequency.exponentialRampToValueAtTime(86, t + dur);
g.gain.setValueAtTime(0.11, t);
g.gain.exponentialRampToValueAtTime(0.001, t + dur);
o.connect(g); g.connect(ctx.destination);
o.start(t); o.stop(t + dur + 0.02);
}

function sawDing(ctx, t) {
envTone(ctx, 1568, t, 0.18, 'sine', 0.16);
envTone(ctx, 2093, t + 0.02, 0.14, 'triangle', 0.05);
}

function marimbaNote(ctx, t, freq, dur, gain) {
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(freq, t);
o.frequency.exponentialRampToValueAtTime(freq * 0.985, t + dur);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.connect(g); g.connect(ctx.destination);
o.start(t); o.stop(t + dur + 0.02);
const o2 = ctx.createOscillator();
const g2 = ctx.createGain();
o2.type = 'triangle';
o2.frequency.setValueAtTime(freq * 2.65, t);
g2.gain.setValueAtTime(gain * 0.28, t);
g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
o2.connect(g2); g2.connect(ctx.destination);
o2.start(t); o2.stop(t + 0.09);
noiseBurst(ctx, t, 0.04, Math.min(2400, freq * 4), freq * 1.4, gain * 0.22, 3.5);
}

function weedStab(ctx, t) {
noiseBurst(ctx, t, 0.055, 2600, 1700, 0.2, 7);
const o = ctx.createOscillator();
const g = ctx.createGain();
o.type = 'square';
o.frequency.setValueAtTime(1480, t);
o.frequency.exponentialRampToValueAtTime(980, t + 0.05);
g.gain.setValueAtTime(0.05, t);
g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
o.connect(g); g.connect(ctx.destination);
o.start(t); o.stop(t + 0.07);
}

function maxLevelOf(kind) {
if (kind === 'chain') return CHAIN.length;
if (kind === 'care') return CARE.length;
if (kind === 'income') return INCOME.length;
return 1;
}

}

function sackPreview() {
for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
if (grid[r][c]) continue;
const counts = {};
[[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([nr, nc]) => {
if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return;
const t = grid[nr][nc];
if (!t || t.kind === 'omon' || t.kind === 'pioneer' || t.kind === 'tool' || (t.kind === 'chain' && isRocketPartLevel(t.level))) return;
const k = t.kind + ':' + t.level;
if (!counts[k]) counts[k] = { tile: t, n: 0 };
counts[k].n++;
});
for (const k in counts) {
if (counts[k].n >= 2 && counts[k].tile.level < maxLevelOf(counts[k].tile.kind)) return counts[k].tile;
}
}
return null;
}

function recipeNodes(tile) {
if (!tile) return null;
if (tile.kind === 'chain' && tile.level === GAGARIN_LEVEL) {
return [hintNode(tile), hintMark('×3'), hintMark('→'), hintNode({ kind: 'chain', level: nextGagarinLevel() })];
}
if (tile.kind === 'chain' && isRocketPartLevel(tile.level)) {
return [hintNode({ kind: 'chain', level: ROCKET_NOSE }), hintMark('+'), hintNode({ kind: 'chain', level: ROCKET_BODY }), hintMark('+'), hintNode({ kind: 'chain', level: ROCKET_TAIL }), hintMark('→'), hintNode({ kind: 'chain', level: ROCKET_LEVEL })];
}
if (tile.kind === 'chain' || tile.kind === 'care' || tile.kind === 'income') {
if (tile.level >= maxLevelOf(tile.kind)) return null;
return [hintNode(tile), hintMark('×3'), hintMark('→'), hintNode({ kind: tile.kind, level: tile.level + 1 })];
}
if (tile.kind === 'pioneer') return [hintNode(tile), hintMark('→'), hintNode({ kind: 'care', level: 1 })];
if (tile.kind === 'tool' && tile.tool === 'saw') {
const empty = document.createElement('span');
empty.className = 'hint-empty';
return [hintNode(tile), hintMark('→'), empty];
}
if (tile.kind === 'tool' && tile.tool === 'sack') {
const pair = sackPreview() || chainTile(1);
const result = { kind: pair.kind, level: Math.min(maxLevelOf(pair.kind), pair.level + 1) };
return [hintNode(pair), hintNode(pair), hintNode(tile), hintMark('→'), hintNode(result)];
}
if (tile.kind === 'tool' && tile.tool === 'jurist') return [hintNode(tile), hintMark('→'), hintNode(chainTile(2))];
if (tile.kind === 'tool' && tile.tool === 'nanobox') return [hintNode(tile), hintMark('→'), hintNode(chainTile(1))];
return null;
}
